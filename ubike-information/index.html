<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>YouBike 臺北市公共自行車即時資訊</title>

  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-beta/css/bootstrap.min.css" integrity="sha384-/Y6pD6FV/Vv2HJnA6t+vslU6fwYXjCFtcEpHbNJ0lyAFsXTsjBbfaDjzALeQsN6M" crossorigin="anonymous">


  <style>
    body{ padding: 1em;  }
    #candidate{
      width:500px;
      height:400px;
      border-color: black;
      margin-right:auto;
      margin-left: 10px;
      margin-bottom: 20px;
      border:solid 1px black;
      padding-left:64px;
      font-size:12px;
      float: left;
    }
    #candidate #head{
      display: block;
      width:400px;
      margin:0px 0px 20px 0px;
    }
    #candidate div{
      background-color: cadetblue;
      width: 150px;
      float:left;
      margin-left:20px;
    }
    #candidate > div > p{
      display: block;
      height: 20px;
      width: 60px;
      margin-left: auto;
      margin-right: auto;
      background-color: white;
      text-align: center;
    }
    #candidate > div >span{
      display: block;
      background-color: green;
      width:140px;
    }
    .warn{
      color:red;
    }
    #fieldSelect{
      width:180px;
      height:300px;
      border-color: black;
      margin-right:auto;
      margin-left: auto;
      margin-bottom: 20px;
      border:solid 1px black;
      font-size:12px;
      float:left;
    }
    #fieldSelect span {
      display: block;
    }
    span.found{
      color:red;
    }
    span.foundspace{
      color:blue;
      background-color: chartreuse;
    }
    #regspacerelation{
      border: 1px solid;
      float: left;
      width: 67px;
      position: relative;
    }
    #spacesearch{
      width:550px;
      height:400px;
      border-color: black;
      margin-right:auto;
      margin-left: 1px;
      margin-bottom: 20px;
      border:solid 1px black;
      padding-left:16px;
      font-size:12px;
      float: left;
    }
    .spacehead{
      font-size:22px;
    }
    #spacesearh input[type=number]{
      width:40px;
      height:20px;
    }
  </style>

</head>
<body>

  <h1>YouBike 臺北市公共自行車即時資訊</h1>

  <div id="app">
    <div id="fieldSelect">
      <span>表單顯示欄位</span>
      <span v-for="field in fields">
        <input type="checkbox" v-model="field.isShow" :checked="field.isShow" :disabled="field.required">{{field.text}}
      </span>
    </div>
    <div id="candidate">
      <p id="head">
          <span>全域搜尋</span><input v-model.trim="searchWord" :disabled="selectedFactors.length == 0" :class="{warn : illegalRegeExp}">
          <span v-show="illegalRegeExp" class="warn">＃請檢查你的關鍵字</span>
          <span v-show="!illegalRegeExp">＃可以使用正規表示法 ex. 大.*大</span>
      </p>
      <hr>
      <div>
        <p>候選區</p>
        <span @click="addFactor(factor)" v-for="factor in searchFactors">
          {{factor.text}}
        </span>
      </div>
      <div>
        <p>已選區</p>

        <span @click="removeFactor(factor)" v-for="factor in selectedFactors">
            {{factor.text}}
        </span>
      </div>
    </div>

    <div id="regspacerelation">
      且<input type="radio" name="opRelation" v-model="opRelation" value="&&">
      或<input type="radio" name="opRelation" v-model="opRelation" value="||">
    </div>

    <div id="spacesearch">
        <p id="head">
            <span>車位搜尋</span>
        </p>
        <div>
          <div>
              <span>車位內部關聯</span>
                <input name="opspace" value="&&"  type="radio" v-model="opSpaceRelation">且
                <input name="opspace" value="||"  type="radio" v-model="opSpaceRelation">或
              <div>
                <input type="checkbox" v-model="checkedTot" :disabled="opTot == '' || valTot == ''">
                <span class="spacehead">場站總停車格</span>
                <input name="tot" value=">"  type="radio" v-model="opTot"><span>大於</span>
                <input name="tot" value=">="  type="radio" v-model="opTot"><span>大於等於</span>
                <input name="tot" value="=="  type="radio" v-model="opTot"><span>等於</span>
                <input name="tot" value="<="  type="radio" v-model="opTot"><span>小於等於</span>
                <input name="tot" value="<"  type="radio" v-model="opTot"><span>小於</span>
                <input type="number" min="1" max="999" step="1" v-model.number="valTot">
              </div>
              <div>
                <input type="checkbox" v-model="checkedSbi" :disabled="opSbi == '' || valSbi == ''">
                <span class="spacehead">場站目前車輛數量</span>
                <input name="sbi" value=">"  type="radio"  v-model="opSbi"><span>大於</span>
                <input name="sbi" value=">="  type="radio" v-model="opSbi"><span>大於等於</span>
                <input name="sbi" value="=="  type="radio" v-model="opSbi"><span>等於</span>
                <input name="sbi" value="<="  type="radio" v-model="opSbi"><span>小於等於</span>
                <input name="sbi" value="<"  type="radio"  v-model="opSbi"><span>小於</span>
                <input type="number" min="1" max="999" step="1" v-model.number="valSbi">
              </div>
              <div>
                <input type="checkbox" v-model="checkedBemp" :disabled="opBemp == '' || valBemp == ''">
                <span class="spacehead">空位數量</span>
                <input name="bemp" value=">"  type="radio"  v-model="opBemp"><span>大於</span>
                <input name="bemp" value=">="  type="radio" v-model="opBemp"><span>大於等於</span>
                <input name="bemp" value="=="  type="radio" v-model="opBemp"><span>等於</span>
                <input name="bemp" value="<="  type="radio" v-model="opBemp"><span>小於等於</span>
                <input name="bemp" value="<"  type="radio"  v-model="opBemp"><span>小於</span>
                <input type="number" min="1" max="999" step="1" v-model.number="valBemp">
              </div>
          </div>
        </div>
    </div>
    <table class="table table-striped">
      <thead>
        <tr>
          <th v-for="field in filteredFields">
            {{field.text}}
          </th>
        </tr>
      </thead>
      <tbody>
        <tr v-for="s in filteredStops" :key="s.sno">
          <td v-for="field in filteredFields">
            <span v-if="field.value == 'mday'">{{s[field.value] | timeFormat}}</span>
            <span v-html="s[field.value]" v-else></span>
          </td>
        </tr>
      </tbody>

    </table>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/2.4.2/vue.js"></script>
  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  <script src="scripts.js"></script>

</body>
</html>
