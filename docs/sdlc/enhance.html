        }
        .stat-label {

        }
        .stat-value {

            margin-top: 5px;
        }
        .phase-container {

            padding: 20px;

        }
        .phase-title {
            font-size: 1.2em;
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 15px;
        }
        .elements-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .category {
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 4px;
        }
        .category-title {
            font-weight: bold;
            color: #666;
            margin-bottom: 8px;
        }
        .element {
            background: #e3f2fd;
            padding: 8px 10px;
            margin: 5px 0;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .element:hover {
            background: #bbdefb;
        }
        .element.removed {
            background: #ffebee;
            color: #999;
        }
        .element.removed .element-name {
            text-decoration: line-through;
        }
        .element.chain-removed {
            background: #fff3cd;
            border: 1px dashed #ff9800;
        }
        .severity-badge {
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.8em;
            font-weight: bold;
            margin-left: 5px;
        }
        .severity-critical { background: #f44336; color: white; }
        .severity-high { background: #ff9800; color: white; }
        .severity-medium { background: #ffc107; color: #333; }
        .severity-low { background: #4caf50; color: white; }
        
        .impact-section {
            background: #fff3cd;
            padding: 15px;
            border-radius: 4px;
            margin-top: 10px;
            display: none;
        }
        .impact-section.show {
            display: block;
        }
        .impact-title {
            font-weight: bold;
            color: #856404;
            margin-bottom: 10px;
        }
        .impact-item {
            background: white;
            padding: 10px;
            margin: 8px 0;
            border-radius: 4px;
            border-left: 4px solid #ff9800;
        }
        .impact-header {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }
        .impact-name {
            font-weight: bold;
            flex: 1;
        }
        .impact-tags {
            display: flex;
            gap: 5px;
        }
        .impact-tag {
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.75em;
        }
        .time-immediate { background: #ffebee; color: #c62828; }
        .time-short { background: #fff3e0; color: #e65100; }
        .time-long { background: #e8f5e9; color: #2e7d32; }
        
        .scope-tech { background: #e3f2fd; color: #1565c0; }
        .scope-business { background: #f3e5f5; color: #6a1b9a; }
        .scope-user { background: #fce4ec; color: #c2185b; }
        .scope-cost { background: #e0f2f1; color: #00695c; }
        
        .impact-description {
            color: #721c24;
            margin: 5px 0;
        }
        .mitigation-box {
            background: #e8f5e9;
            padding: 8px;
            margin-top: 8px;
            border-radius: 3px;
            font-size: 0.9em;
        }
        .mitigation-title {
            font-weight: bold;
            color: #2e7d32;
            margin-bottom: 3px;
        }
        .chain-effect {
            background: #fff8e1;
            padding: 8px;
            margin-top: 8px;
            border-radius: 3px;
            font-size: 0.9em;
        }
        .chain-title {
            font-weight: bold;
            color: #f57c00;
            margin-bottom: 3px;
        }
        .controls {
            margin: 20px 0;
            text-align: center;

            margin: 0 10px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background: #2563eb;
            color: white;

            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
            display: flex;
            gap: 20px;
            font-size: 0.9em;

            align-items: center;
            gap: 5px;

</head>

    <div class="container">
        <h1>🔧 SDLC 階段缺失影響分析工具 (增強版)</h1>

        <div class="legend">
            <div class="legend-item">
                <span class="severity-badge severity-critical">致命</span>
                <span>不可接受的風險</span>
            </div>
            <div class="legend-item">
                <span class="severity-badge severity-high">高</span>
                <span>嚴重影響</span>
            </div>
            <div class="legend-item">
                <span class="severity-badge severity-medium">中</span>
                <span>中度影響</span>
            </div>
            <div class="legend-item">
                <span class="severity-badge severity-low">低</span>
                <span>可管理</span>
            </div>
        </div>

        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-label">已移除項目</div>
                <div class="stat-value" id="removed-count">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">連鎖影響項目</div>
                <div class="stat-value" id="chain-count">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">風險等級</div>
                <div class="stat-value" id="risk-level">正常</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">致命風險數</div>
                <div class="stat-value" id="critical-count" style="color: #f44336;">0</div>
            </div>
        </div>
        
        <div class="controls">
            <button onclick="resetAll()">重置所有</button>
            <button onclick="showAllImpacts()">顯示所有影響</button>
            <button onclick="showCriticalOnly()">只顯示致命項目</button>
        </div>

        <div id="phases"></div>
    </div>

                        },
                        { 
                            id: "rel-d3", 
                            name: "SOP / Runbook",
                            severity: "high",
                            timeframe: "immediate",
                            scope: ["tech", "business"],
                            impact: "運維團隊不清楚如何應對異常，停機時間長",
                            mitigation: "建立緊急聯絡機制，但處理效率低",
                            dependencies: []
                        }
                    ]
                }
            }
        };

        // 建立依賴關係映射
        const reverseDependencies = {};
        Object.values(sdlcData).forEach(phase => {
            [...phase.participants.items, ...phase.documents.items].forEach(item => {
                if (item.dependencies) {
                    item.dependencies.forEach(depId => {
                        if (!reverseDependencies[depId]) {
                            reverseDependencies[depId] = [];
                        }
                        reverseDependencies[depId].push(item.id);
                    });
                }
            });
        });

        let removedItems = new Set();
        let chainRemovedItems = new Set();

        function updateStats() {
            document.getElementById('removed-count').textContent = removedItems.size;
            document.getElementById('chain-count').textContent = chainRemovedItems.size;
            
            // 計算風險等級
            let criticalCount = 0;
            let highCount = 0;
            
            removedItems.forEach(itemId => {
                const item = findItemById(itemId);
                if (item) {
                    if (item.severity === 'critical') criticalCount++;
                    if (item.severity === 'high') highCount++;
                }
            });
            
            document.getElementById('critical-count').textContent = criticalCount;
            
            let riskLevel = '正常';
            if (criticalCount >= 3) riskLevel = '🔴 極高風險';
            else if (criticalCount >= 1) riskLevel = '🟠 高風險';
            else if (highCount >= 3) riskLevel = '🟡 中風險';
            else if (removedItems.size > 0) riskLevel = '🟢 低風險';
            
            document.getElementById('risk-level').textContent = riskLevel;
        }

        function findItemById(itemId) {
            for (const phase of Object.values(sdlcData)) {
                for (const item of [...phase.participants.items, ...phase.documents.items]) {
                    if (item.id === itemId) return item;
                }
            }
            return null;
        }

        function calculateChainEffects(itemId) {
            const affected = new Set();
            const queue = [itemId];
            
            while (queue.length > 0) {
                const currentId = queue.shift();
                const item = findItemById(currentId);
                
                if (item && item.dependencies) {
                    item.dependencies.forEach(depId => {
                        if (!removedItems.has(depId) && !affected.has(depId)) {
                            affected.add(depId);
                            queue.push(depId);
                        }
                    });
                }
            }
            
            return affected;
        }

        function renderPhases() {
            const container = document.getElementById('phases');
            container.innerHTML = '';
            
            // 重新計算連鎖影響
            chainRemovedItems.clear();
            removedItems.forEach(itemId => {
                const chainEffects = calculateChainEffects(itemId);
                chainEffects.forEach(id => chainRemovedItems.add(id));
            });
            
            Object.keys(sdlcData).forEach(phaseKey => {
                const phase = sdlcData[phaseKey];
                const phaseDiv = document.createElement('div');
                phaseDiv.className = 'phase-container';
                phaseDiv.innerHTML = `
                    <div class="phase-title">${phase.title}</div>
                    <div class="elements-grid">
                        <div class="category">
                            <div class="category-title">${phase.participants.title}</div>
                            ${phase.participants.items.map(item => renderElement(item)).join('')}
                        </div>
                        <div class="category">
                            <div class="category-title">${phase.documents.title}</div>
                            ${phase.documents.items.map(item => renderElement(item)).join('')}
                        </div>
                    </div>
                    <div class="impact-section ${hasRemovedItems(phaseKey) ? 'show' : ''}" id="impact-${phaseKey}">
                        <div class="impact-title">⚠️ 缺失影響分析：</div>
                        ${getImpactsForPhase(phaseKey)}
                    </div>
                `;
                container.appendChild(phaseDiv);
            });
            
            updateStats();
        }

        function renderElement(item) {
            const isRemoved = removedItems.has(item.id);
            const isChainRemoved = chainRemovedItems.has(item.id);
            const severityClass = `severity-${item.severity}`;
            
            let className = 'element';
            if (isRemoved) className += ' removed';
            else if (isChainRemoved) className += ' chain-removed';
            
            return `
                <div class="${className}" 
                     onclick="toggleItem('${item.id}')"
                     data-id="${item.id}">
                    <span class="element-name">${item.name}</span>
                    <span class="severity-badge ${severityClass}">${getSeverityText(item.severity)}</span>
                </div>
            `;
        }

        function getSeverityText(severity) {
            const map = {
                'critical': '致命',
                'high': '高',
                'medium': '中',
                'low': '低'
            };
            return map[severity] || severity;
        }

        function getTimeframeText(timeframe) {
            const map = {
                'immediate': '立即',
                'short': '短期',
                'long': '長期'
            };
            return map[timeframe] || timeframe;
        }

        function getScopeText(scope) {
            const map = {
                'tech': '技術',
                'business': '業務',
                'user': '用戶',
                'cost': '成本'
            };
            return scope.map(s => map[s] || s).join(', ');
        }

        function toggleItem(itemId) {
            if (removedItems.has(itemId)) {
                removedItems.delete(itemId);
            } else {
                removedItems.add(itemId);
            }
            renderPhases();
        }

        function hasRemovedItems(phaseKey) {
            const phase = sdlcData[phaseKey];
            const allItems = [...phase.participants.items, ...phase.documents.items];
            return allItems.some(item => removedItems.has(item.id) || chainRemovedItems.has(item.id));
        }

        function getImpactsForPhase(phaseKey) {
            const phase = sdlcData[phaseKey];
            const allItems = [...phase.participants.items, ...phase.documents.items];
            const impacts = [];
            
            allItems.forEach(item => {
                if (removedItems.has(item.id)) {
                    const chainEffects = calculateChainEffects(item.id);
                    impacts.push(renderImpactItem(item, chainEffects));
                } else if (chainRemovedItems.has(item.id)) {
                    // 顯示連鎖影響的項目
                    const affectedBy = [];
                    removedItems.forEach(removedId => {
                        const removed = findItemById(removedId);
                        if (removed && removed.dependencies && removed.dependencies.includes(item.id)) {
                            affectedBy.push(removed.name);
                        }
                    });
                    if (affectedBy.length > 0) {
                        impacts.push(`
                            <div class="impact-item" style="border-left-color: #ff9800;">
                                <div class="impact-header">
                                    <span class="impact-name">🔗 ${item.name} (連鎖影響)</span>
                                </div>
                                <div class="impact-description">
                                    受到影響因為缺少：${affectedBy.join(', ')}
                                </div>
                            </div>
                        `);
                    }
                }
            });
            
            return impacts.join('');
        }

        function renderImpactItem(item, chainEffects) {
            const severityColors = {
                'critical': '#f44336',
                'high': '#ff9800',
                'medium': '#ffc107',
                'low': '#4caf50'
            };
            
            const chainAffected = Array.from(chainEffects).map(id => {
                const affected = findItemById(id);
                return affected ? affected.name : id;
            });
            
            return `
                <div class="impact-item" style="border-left-color: ${severityColors[item.severity]};">
                    <div class="impact-header">
                        <span class="impact-name">${item.name}</span>
                        <div class="impact-tags">
                            <span class="impact-tag time-${item.timeframe}">${getTimeframeText(item.timeframe)}</span>
                            ${item.scope.map(s => `<span class="impact-tag scope-${s}">${s === 'tech' ? '技術' : s === 'business' ? '業務' : s === 'user' ? '用戶' : '成本'}</span>`).join('')}
                        </div>
                    </div>
                    <div class="impact-description">• ${item.impact}</div>
                    ${item.mitigation ? `
                        <div class="mitigation-box">
                            <div class="mitigation-title">💡 補救措施：</div>
                            ${item.mitigation}
                        </div>
                    ` : ''}
                    ${chainAffected.length > 0 ? `
                        <div class="chain-effect">
                            <div class="chain-title">⚡ 連鎖影響：</div>
                            將導致以下項目也受影響：${chainAffected.join(', ')}
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function resetAll() {
            removedItems.clear();
            chainRemovedItems.clear();
            renderPhases();
        }

        function showAllImpacts() {
            Object.keys(sdlcData).forEach(phaseKey => {
                const phase = sdlcData[phaseKey];
                const allItems = [...phase.participants.items, ...phase.documents.items];
                allItems.forEach(item => removedItems.add(item.id));
            });
            renderPhases();
        }

        function showCriticalOnly() {
            removedItems.clear();
            Object.keys(sdlcData).forEach(phaseKey => {
                const phase = sdlcData[phaseKey];
                const allItems = [...phase.participants.items, ...phase.documents.items];
                allItems.forEach(item => {
                    if (item.severity === 'critical') {
                        removedItems.add(item.id);
                    }
                });
            });
            renderPhases();
        }

        // 初始化
        renderPhases();
    </script>
</body>
</html>
