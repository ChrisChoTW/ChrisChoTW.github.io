<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博愛座道德困境遊戲</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 20%, #f093fb 40%, #f5576c 60%, #4facfe 80%, #00f2fe 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }
        
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        /* 開始畫面樣式 */
        .screen {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .start-content {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 50px 40px;
            border-radius: 25px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        .start-content::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, rgba(102, 126, 234, 0.05), rgba(118, 75, 162, 0.05));
            pointer-events: none;
        }
        
        .start-content h1 {
            font-size: 3.2em;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 2px 10px rgba(102, 126, 234, 0.2);
            position: relative;
            z-index: 2;
        }
        
        .game-description {
            margin: 40px 0;
            position: relative;
            z-index: 2;
        }
        
        .game-description p {
            font-size: 1.3em;
            line-height: 1.8;
            color: #444;
            margin: 20px 0;
        }
        
        .features {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 40px 0;
            flex-wrap: wrap;
        }
        
        .feature {
            background: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 15px;
            min-width: 120px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
            border: 1px solid rgba(102, 126, 234, 0.1);
        }
        
        .feature:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.15);
        }
        
        .feature .emoji {
            font-size: 2em;
            display: block;
            margin-bottom: 10px;
        }
        
        .feature span:last-child {
            font-weight: 600;
            color: #555;
            font-size: 1.1em;
        }
        
        .settings {
            margin-top: 50px;
            position: relative;
            z-index: 2;
        }
        
        .setting-group {
            background: rgba(255, 255, 255, 0.6);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            border: 1px solid rgba(102, 126, 234, 0.1);
        }
        
        .setting-group label {
            font-size: 1.2em;
            font-weight: 600;
            color: #555;
            margin-right: 15px;
        }
        
        .setting-group select {
            padding: 12px 20px;
            border: 2px solid rgba(102, 126, 234, 0.3);
            border-radius: 10px;
            font-size: 1.1em;
            background: rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
        }
        
        .setting-group select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            outline: none;
        }
        
        .start-button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 18px 60px;
            font-size: 1.4em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .start-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
        }
        
        .start-button:active {
            transform: translateY(0);
        }
        
        #game-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            max-width: 800px;
            width: 90%;
            margin: 20px auto;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        #game-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 8px;
            background: linear-gradient(90deg, #4CAF50, #2196F3, #9C27B0, #FF9800);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
        }
        
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        #scenario {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            margin: 25px 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 1px solid rgba(76, 175, 80, 0.2);
            border-left: 5px solid #4CAF50;
            position: relative;
            line-height: 1.8;
            font-size: 1.2em;
            color: #333;
        }
        
        #result {
            background: rgba(248, 249, 250, 0.95);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 15px;
            margin: 25px 0;
            border: 1px solid rgba(33, 150, 243, 0.2);
            border-left: 5px solid #2196F3;
            font-size: 1.2em;
            line-height: 1.7;
            box-shadow: 0 8px 25px rgba(33, 150, 243, 0.1);
            color: #444;
        }
        
        #outcome-type {
            background: linear-gradient(135deg, #e3f2fd, #bbdefb);
            padding: 18px 25px;
            border-radius: 25px;
            margin: 20px 0 30px;
            display: inline-block;
            font-weight: 600;
            font-size: 1em;
            box-shadow: 0 5px 15px rgba(33, 150, 243, 0.2);
            border: 1px solid rgba(33, 150, 243, 0.1);
            color: #1565c0;
        }
        
        #final-stats {
            background: rgba(245, 245, 245, 0.95);
            backdrop-filter: blur(15px);
            padding: 35px;
            border-radius: 20px;
            margin: 35px 0;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        
        #timer {
            font-size: 2.5rem;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #ff6b6b, #ff8e53);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px auto;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
            position: relative;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% {
                transform: scale(1);
                box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 8px 25px rgba(255, 107, 107, 0.6);
            }
            100% {
                transform: scale(1);
                box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
            }
        }
        
        #timer::before {
            content: '';
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            border: 2px solid #ff6b6b;
            border-radius: 50%;
            animation: ripple 2s infinite;
        }
        
        @keyframes ripple {
            0% {
                transform: scale(1);
                opacity: 0.7;
            }
            70% {
                transform: scale(1.3);
                opacity: 0;
            }
            100% {
                opacity: 0;
            }
        }
        
        #timer.warning {
            background: linear-gradient(135deg, #ff9a44, #ff6b6b);
            animation: pulse-warning 1s infinite;
        }
        
        @keyframes pulse-warning {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 4px 15px rgba(255, 107, 107, 0.6);
            }
            50% {
                transform: scale(1.1);
                box-shadow: 0 10px 30px rgba(255, 107, 107, 0.8);
            }
        }
        #progress {
            font-size: 1rem;
            color: white;
            margin: 20px auto;
            font-weight: 600;
            padding: 12px 20px;
            border-radius: 30px;
            background: linear-gradient(90deg, #4CAF50 0%, #e0e0e0 0%);
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            width: 80%;
            max-width: 300px;
            position: relative;
            overflow: hidden;
            transition: all 0.5s ease;
        }
        
        #progress::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255,255,255,0.2);
            z-index: 1;
            border-radius: 30px;
        }
        
        #progress span {
            position: relative;
            z-index: 2;
        }
        #options {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }
        button {
            margin: 15px;
            padding: 15px 30px;
            font-size: 17px;
            cursor: pointer;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            border: none;
            border-radius: 25px;
            box-shadow: 0 8px 20px rgba(76, 175, 80, 0.3);
            transition: all 0.3s ease;
            min-width: 220px;
            font-weight: 600;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }
        
        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        
        button:hover::before {
            left: 100%;
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(76, 175, 80, 0.4);
            background: linear-gradient(135deg, #45a049, #3d8b40);
        }
        
        button:active {
            transform: translateY(0);
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }
        
        button:disabled {
            background: linear-gradient(135deg, #cccccc, #bbbbbb);
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
        }
        #result {
            font-style: italic;
        }
        #outcome-type {
            font-weight: bold;
        }
        #final-stats {
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div id="start-screen" class="screen">
        <div class="start-content">
            <h1>博愛座道德困境</h1>
            <div class="game-description">
                <p>🚇 你準備好面對道德抉擇的挑戰了嗎？</p>
                <p>在這個互動式遊戲中，你將置身於各種博愛座相關的兩難情境，每個決定都可能帶來意想不到的後果...</p>
                <div class="features">
                    <div class="feature">
                        <span class="emoji">⏱️</span>
                        <span>限時決策</span>
                    </div>
                    <div class="feature">
                        <span class="emoji">🤔</span>
                        <span>道德兩難</span>
                    </div>
                    <div class="feature">
                        <span class="emoji">🎯</span>
                        <span>多重結局</span>
                    </div>
                </div>
            </div>
            <div class="settings">
                <div class="setting-group">
                    <label for="question-count">選擇題目數量：</label>
                    <select id="question-count">
                        <option value="3">3 題 (快速體驗)</option>
                        <option value="5" selected>5 題 (標準模式)</option>
                        <option value="10">10 題 (深度挑戰)</option>
                    </select>
                </div>
                <button id="start-button" class="start-button">開始遊戲</button>
            </div>
        </div>
    </div>

    <div id="game-container" class="screen" style="display: none;">
        <div class="game-content">
            <!-- 決策樹容器 -->
            <div id="progress">第 1 題，共 5 題</div>
            <div id="timer">30</div>
            <p id="scenario"></p>
            <div id="options"></div>
            <p id="result"></p>
            <p id="outcome-type"></p>
            <button id="next-scenario" style="display: none;">下一個情境</button>
            <div id="final-stats" style="display: none;"></div>
        </div>
    </div>
    
    <!-- Modal/Lightbox for Decision Tree -->
    <div id="tree-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <div class="modal-header">
                <h2 id="modal-title">決策樹詳細檢視</h2>
            </div>
            <div class="modal-body" id="modal-tree-content">
                <!-- Tree content will be inserted here -->
            </div>
        </div>
    </div>

        <script>
            // 定義情境數據
            const scenarios = [
            {
                description: "一位孕婦和一位拄拐杖的老人同時需要座位，但只有一個博愛座。",
                options: [
                    { text: "讓座給孕婦", outcomes: [

                        { result: "孕婦和老人都理解你的決定，老人找到了扶手保持平衡。", type: "預期的正面結果" },

                    { text: "讓座給老人", outcomes: [

                        { result: "孕婦感到不適，需要緊急下車就醫。", type: "意外的負面結果" },

                    { text: "請求其他乘客讓座", outcomes: [

                    { text: "詢問年輕人的具體情況", outcomes: [

                    { text: "請求其他乘客協助判斷", outcomes: [

            {
  "description": "一位看起來疲憊的外國遊客帶著大型行李上了擁擠的捷運，他似乎想要尋找座位但不會說當地語言。博愛座上坐著一位年長的本地居民。你站在附近。",

        ];


            // 獲取DOM元素
            const scenarioElement = document.getElementById('scenario');
            const optionsElement = document.getElementById('options');
            const resultElement = document.getElementById('result');
            const outcomeTypeElement = document.getElementById('outcome-type');
            const nextScenarioButton = document.getElementById('next-scenario');
            const progressElement = document.getElementById('progress');
            const timerElement = document.getElementById('timer');
            
            // 遊戲變數
            let currentScenarioIndex = 0;
            let answers = [];
            let timerInterval;
            let totalQuestions = 5; // 預設5題
            let selectedScenarios = [];
            let decisionTreeData = []; // 存儲決策樹數據

            function startGame() {
                // 重置所有遊戲狀態
                currentScenarioIndex = 0;
                answers = [];
                decisionTreeData = [];
                
                // 重置計時器
                clearInterval(timerInterval);
                
                // 重新選擇情境
                const shuffled = [...scenarios].sort(() => 0.5 - Math.random());
                selectedScenarios = shuffled.slice(0, totalQuestions);
                
                // 重置UI
                document.getElementById('start-screen').style.display = 'none';
                document.getElementById('game-container').style.display = 'block';
                document.getElementById('scenario').style.display = 'block';
                document.getElementById('options').style.display = 'block';
                document.getElementById('timer').style.display = 'block';
                document.getElementById('final-stats').innerHTML = '';
                document.getElementById('final-stats').style.display = 'none';
                
                // 開始遊戲
                showNextScenario();
            }

            function startTimer() {
                let timeLeft = 30;
                updateTimerDisplay(timeLeft);

                // 重置計時器樣式
                timerElement.className = '';
                timerElement.style.transform = 'scale(1)';

                timerInterval = setInterval(() => {
                    timeLeft--;
                    updateTimerDisplay(timeLeft);

                    // 倒數計時動畫效果
                    if (timeLeft <= 10) {
                        timerElement.classList.add('warning');
                        timerElement.style.animation = 'none';
                        timerElement.offsetHeight; // 觸發重繪
                        timerElement.style.animation = 'pulse-warning 0.5s infinite';
                    } else if (timeLeft <= 20) {
                        timerElement.style.background = 'linear-gradient(135deg, #ff9a44, #ff6b6b)';
                    }

                    // 點擊反饋動畫
                    timerElement.style.transform = 'scale(0.95)';
                    setTimeout(() => {
                        timerElement.style.transform = 'scale(1)';
                    }, 100);

                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        disableOptions();
                        resultElement.textContent = "時間到！你沒有及時做出選擇。";
                        outcomeTypeElement.textContent = "錯失機會";
                        answers.push({ scenario: currentScenarioIndex, choice: "未選擇", outcome: "錯失機會" });
                        nextScenarioButton.style.display = 'inline-block';

                        // 時間到時的動畫效果
                        timerElement.style.animation = 'shake 0.5s';
                        timerElement.style.background = 'linear-gradient(135deg, #ff3d00, #d32f2f)';
                    }
                }, 1000);
            }

            function updateProgressBar() {
                const total = totalQuestions;
                const current = currentScenarioIndex + 1; // 因為是0-based
                let progressPercentage;

                if (total === 1) {
                    progressPercentage = 100;
                } else if (total === 2) {
                    progressPercentage = current === 1 ? 50 : 100;
                } else {
                    // 第一題33%，最後一題100%，中間均勻分佈
                    progressPercentage = current === 1 ? 33 : 
                                       (current === total ? 100 : 
                                       (33 + ((current - 1) * (67 / (total - 1)))));
                }

                progressElement.textContent = `第 ${current} 題，共 ${total} 題`;
                progressElement.style.background = `linear-gradient(90deg, #4CAF50 ${progressPercentage}%, #e0e0e0 ${progressPercentage}%)`;
            }

            function updateTimerDisplay(time) {
                timerElement.textContent = time;
                // 根據剩餘時間更新大小和顏色
                const scale = 1 + (10 - time) * 0.02; // 隨著時間推移稍微變大
                timerElement.style.transform = `scale(${scale})`;
            }

            // 添加動畫效果
            const style = document.createElement('style');
            style.textContent = `

                    from { opacity: 0; transform: translateY(10px); }

                @keyframes fadeOut {
                    from { opacity: 1; transform: translateY(0); }
                    to { opacity: 0; transform: translateY(-10px); }
                }
                
                @keyframes shake {
                    0% { transform: translateX(0) rotate(0deg); }
                    25% { transform: translateX(-5px) rotate(-5deg); }
                    50% { transform: translateX(5px) rotate(5deg); }
                    75% { transform: translateX(-5px) rotate(-5deg); }
                    100% { transform: translateX(0) rotate(0deg); }
                }
            `;
            document.head.appendChild(style);

            function disableOptions() {
                const buttons = optionsElement.getElementsByTagName('button');
                for (let button of buttons) {
                    button.disabled = true;
                }
            }

            function showNextScenario() {
                // 如果已經沒有更多題目，顯示最終統計
                if (currentScenarioIndex >= totalQuestions) {
                    showFinalStats();
                    return;
                }

                // 確保 currentScenarioIndex 在有效範圍內
                if (currentScenarioIndex >= selectedScenarios.length) {
                    showFinalStats();
                    return;
                }

                const scenario = selectedScenarios[currentScenarioIndex];

                // 淡出當前場景
                scenarioElement.style.animation = 'fadeOut 0.3s';
                optionsElement.style.opacity = '0';
                
                setTimeout(() => {
                    scenarioElement.textContent = scenario.description;
                    optionsElement.innerHTML = '';  // 清空選項
                    
                    // 添加選項按鈕
                    scenario.options.forEach((option, index) => {
                        const button = document.createElement('button');
                        button.textContent = option.text;
                        button.onclick = () => selectOption(index);
                        button.className = 'option-button';
                        optionsElement.appendChild(button);
                    });
                    
                    // 淡入新場景和選項
                    scenarioElement.style.animation = 'fadeIn 0.5s';
                    optionsElement.style.transition = 'opacity 0.5s';
                    optionsElement.style.opacity = '1';


                    // 重置結果顯示
                    resultElement.textContent = '';
                    outcomeTypeElement.textContent = '';
                    nextScenarioButton.style.display = 'none';

                    // 開始計時
                    startTimer();

                    // 更新進度條
                    updateProgressBar();

                }, 300);
            }


            function selectOption(optionIndex) {
                clearInterval(timerInterval);
                const scenario = selectedScenarios[currentScenarioIndex];
                const option = scenario.options[optionIndex];
                const outcome = option.outcomes[Math.floor(Math.random() * option.outcomes.length)];

                resultElement.textContent = outcome.result;
                outcomeTypeElement.textContent = outcome.type;

                // 禁用所有選項按鈕
                disableOptions();

                // 顯示下一題按鈕
                nextScenarioButton.style.display = 'inline-block';

                // 保存答案
                answers.push({
                    scenario: currentScenarioIndex,
                    choice: option.text,
                    outcome: outcome.result,
                    type: outcome.type
                });

            }

            // 開始按鈕點擊事件
            document.getElementById('start-button').addEventListener('click', () => {
                totalQuestions = parseInt(document.getElementById('question-count').value);
                document.getElementById('start-screen').style.display = 'none';
                document.getElementById('game-container').style.display = 'block';
                startGame();
            });

            // 顯示最終統計和決策樹
            function showFinalStats() {
                // 隱藏遊戲介面
                document.getElementById('scenario').style.display = 'none';
                document.getElementById('options').style.display = 'none';
                document.getElementById('timer').style.display = 'none';
                nextScenarioButton.style.display = 'none';
                document.getElementById('result').style.display = 'none';
                document.getElementById('outcome-type').style.display = 'none';
                document.getElementById('progress').style.display = 'none';
                
                // 添加樣式
                addTreeStyles();
                addModalStyles();
                
                // 顯示最終統計區域
                const finalStatsElement = document.getElementById('final-stats');
                finalStatsElement.style.display = 'block';
                
                // 生成決策樹按鈕列表
                let scenarioButtons = generateScenarioButtons();
                
                finalStatsElement.innerHTML = `

                // 設置 modal 關閉功能

            }

                let buttonsHTML = '';
                selectedScenarios.forEach((scenario, index) => {
                    const userChoice = answers[index] ? answers[index].choice : '未選擇';
                    const userOutcome = answers[index] ? answers[index].type : '';

            function generateSingleScenarioTree(scenario, scenarioIndex) {
                let treeHTML = `
                    <div class="single-tree-container">
                        <div class="horizontal-tree">
                            <div class="scenario-start">
                                <div class="scenario-box">
                                    <div class="scenario-title">問題 ${scenarioIndex + 1}</div>

                scenario.options.forEach((option, optionIndex) => {

            // 設置 Modal 處理器
            function setupModalHandlers() {
                const modal = document.getElementById('tree-modal');
                const closeBtn = document.querySelector('.modal-close');
                
                // 關閉按鈕
                closeBtn.onclick = function() {
                    modal.style.display = 'none';
                    document.body.style.overflow = 'auto';
                }
                
                // 點擊 modal 外部關閉
                window.onclick = function(event) {
                    if (event.target == modal) {
                        modal.style.display = 'none';
                        document.body.style.overflow = 'auto';
                    }
                }
                
                // ESC 鍵關閉
                document.addEventListener('keydown', function(event) {
                    if (event.key === 'Escape' && modal.style.display === 'block') {
                        modal.style.display = 'none';
                        document.body.style.overflow = 'auto';
                    }
                });
            }

                        max-width: 350px;
                        box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
                        position: relative;
                    }
                    
                    .scenario-box::after {
                        content: '';
                        position: absolute;
                        top: 50%;
                        right: -50px;
                        width: 50px;
                        height: 3px;
                        background: linear-gradient(90deg, #999, #ddd);
                        transform: translateY(-50%);
                    }
                    
                    .scenario-title {
                        font-weight: bold;
                        font-size: 18px;
                        margin-bottom: 12px;
                        opacity: 0.95;
                    }
                    
                    .scenario-text {
                        font-size: 16px;
                        line-height: 1.7;
                    }
                    
                    /* 選項欄 */
                    .options-column {
                        display: flex;
                        flex-direction: column;
                        gap: 30px;
                        position: relative;
                    }
                    
                    .option-row {
                        display: flex;
                        align-items: flex-start;
                        gap: 30px;
                        position: relative;
                    }
                    
                    .option-row.user-selected {
                        background: linear-gradient(90deg, rgba(76, 175, 80, 0.08) 0%, transparent 100%);
                        border-radius: 15px;
                        padding: 15px;
                        margin: -15px;
                        border: 2px solid rgba(76, 175, 80, 0.2);
                    }
                    
                    .option-box {
                        background: white;
                        border: 3px solid #FF9800;
                        border-radius: 15px;
                        padding: 15px 20px;
                        width: 200px;
                        min-width: 200px;
                        max-width: 200px;
                        text-align: center;
                        box-shadow: 0 3px 12px rgba(255, 152, 0, 0.2);
                        position: relative;
                        flex-shrink: 0;
                    }
                    
                    .option-box::after {
                        content: '';
                        position: absolute;
                        top: 50%;
                        right: -30px;
                        width: 30px;
                        height: 3px;
                        background: linear-gradient(90deg, #FF9800, #ddd);
                        transform: translateY(-50%);
                    }
                    
                    .option-row.user-selected .option-box {
                        background: #fff3e0;
                        border-color: #f57c00;
                        font-weight: bold;
                        box-shadow: 0 4px 15px rgba(245, 124, 0, 0.3);
                        border-width: 3px;
                    }
                    
                    .option-label {
                        font-size: 15px;
                        color: #333;
                        font-weight: 500;
                        word-wrap: break-word;
                        word-break: break-word;
                        overflow-wrap: break-word;
                        line-height: 1.4;
                    }
                    
                    /* 結果欄 */
                    .outcomes-column {
                        display: flex;
                        flex-direction: column;
                        gap: 15px;
                        min-width: 250px;
                        max-width: 320px;
                        flex-shrink: 0;
                    }
                    
                    .outcome-box {
                        padding: 15px;
                        border-radius: 12px;
                        border: 2px solid;
                        position: relative;
                        background: white;
                        box-shadow: 0 3px 8px rgba(0,0,0,0.1);
                        transition: all 0.3s ease;
                        word-wrap: break-word;
                        word-break: break-word;
                        overflow-wrap: break-word;
                        hyphens: auto;
                    }
                    
                    .outcome-box:hover {
                        transform: translateX(5px);
                        box-shadow: 0 5px 15px rgba(0,0,0,0.15);
                    }
                    
                    .outcome-box.positive {
                        background: linear-gradient(135deg, #e8f5e9 0%, #f1f8e9 100%);
                        border-color: #4CAF50;
                    }
                    
                    .outcome-box.negative {
                        background: linear-gradient(135deg, #ffebee 0%, #fce4ec 100%);
                        border-color: #f44336;
                    }
                    
                    .outcome-box.neutral {
                        background: linear-gradient(135deg, #e3f2fd 0%, #e1f5fe 100%);
                        border-color: #2196F3;
                    }
                    
                    .outcome-box.user-outcome {
                        transform: scale(1.05);
                        box-shadow: 0 0 0 4px rgba(76, 175, 80, 0.3);
                        font-weight: bold;
                        border-width: 3px;
                    }
                    
                    .outcome-box.user-outcome:hover {
                        transform: scale(1.05) translateX(5px);
                    }
                    
                    .outcome-header {
                        font-weight: bold;
                        font-size: 14px;
                        margin-bottom: 8px;
                        padding-bottom: 8px;
                        border-bottom: 2px solid rgba(0,0,0,0.1);
                        word-wrap: break-word;
                    }
                    
                    .outcome-box.positive .outcome-header {
                        color: #2e7d32;
                    }
                    
                    .outcome-box.negative .outcome-header {
                        color: #c62828;
                    }
                    
                    .outcome-box.neutral .outcome-header {
                        color: #1565c0;
                    }
                    
                    .outcome-detail {
                        font-size: 13px;
                        line-height: 1.5;
                        color: #444;
                        word-wrap: break-word;
                        word-break: break-word;
                        overflow-wrap: break-word;
                    }
                    
                    /* 連接線樣式 */
                    .option-row::before {
                        content: '';
                        position: absolute;
                        left: -20px;
                        top: 50%;
                        width: 20px;
                        height: 2px;
                        background: #ccc;
                        transform: translateY(-50%);
                    }
                    
                    .restart-button {
                        padding: 12px 30px;
                        font-size: 1.1em;
                        background: linear-gradient(135deg, #4CAF50, #45a049);
                        color: white;
                        border: none;
                        border-radius: 30px;
                        cursor: pointer;
                        transition: all 0.3s ease;
                        box-shadow: 0 4px 10px rgba(76, 175, 80, 0.3);
                        font-weight: bold;
                        margin-top: 30px;
                    }
                    
                    .restart-button:hover {
                        transform: translateY(-2px);
                        box-shadow: 0 6px 15px rgba(76, 175, 80, 0.4);
                    }
                    
                    .all-paths h3 {
                        color: #333;
                        margin: 30px 0 20px 0;
                        font-size: 1.8em;
                        text-align: center;
                        background: linear-gradient(135deg, #667eea, #764ba2);
                        -webkit-background-clip: text;
                        -webkit-text-fill-color: transparent;
                        background-clip: text;
                    }
                    
                    .all-paths {
                        margin: 40px 0;
                        padding: 0 20px;
                    }
                    
                    /* 響應式設計 */
                    @media (max-width: 768px) {
                        .horizontal-tree {
                            flex-direction: column;
                        }
                        
                        .scenario-box::after,
                        .option-box::after,
                        .option-row::before {
                            display: none;
                        }
                        
                        .path-connector {
                            display: block;
                            margin: 10px 0;
                        }
                    }
                `;
                document.head.appendChild(style);
            }

            // 下一個情境按鈕點擊事件
            nextScenarioButton.addEventListener('click', () => {
                currentScenarioIndex++;
                showNextScenario();
            });
        </script>
    </body>
</body>
</html>
