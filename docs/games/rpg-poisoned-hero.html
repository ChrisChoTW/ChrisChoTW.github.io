<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG中毒英雄</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #1a1a2e;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .game-container {
            max-width: 28rem;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #00ff00;
            text-shadow: 0 0 5px #00ff00;
        }
        .health-bar {
            width: 100%;
            height: 30px;
            background-color: #4a0000;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        .health-bar-inner {
            width: 100%;
            height: 100%;
            background-color: #ff0000;
            transition: width 0.3s ease;
        }
        .health-text {
            text-align: center;
            margin-bottom: 20px;
            font-size: 18px;
        }
        .use-potion {
            display: block;
            width: 100%;
            padding: 10px;
            font-size: 18px;
            color: #ffffff;
            background-color: #0066cc;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .use-potion:hover {
            background-color: #004c99;
        }
        .use-potion:active {
            transform: scale(0.98);
        }
        .status-text {
            margin-top: 20px;
            text-align: center;
            font-style: italic;
        }
        .poison-effect {
            color: #00ff00;
            text-shadow: 0 0 5px #00ff00;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .low-health {
            animation: shake 0.5s infinite;
        }
        .game-over {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 48px;
            color: #ff0000;
            animation: shake 0.5s infinite;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>RPG中毒英雄</h1>
        <div class="health-bar">
            <div class="health-bar-inner"></div>
        </div>
        <div class="health-text">生命值: <span id="health-value">100</span></div>
        <button class="use-potion">使用藥水</button>
        <div class="status-text">你被毒蜘蛛咬傷了！毒素正在侵蝕你的身體...</div>
    </div>

    <script>
        const healthBar = document.querySelector('.health-bar-inner');
        const healthValue = document.getElementById('health-value');
        const usePotion = document.querySelector('.use-potion');
        const statusText = document.querySelector('.status-text');
        const gameContainer = document.querySelector('.game-container');

        let health = 100;
        let poisonDamage = 2;
        let gameOver = false;

        function updateHealth() {
            health = Math.max(0, health);
            healthBar.style.width = `${health}%`;
            healthValue.textContent = Math.round(health);

            if (health <= 30) {
                healthBar.classList.add('low-health');
            } else {
                healthBar.classList.remove('low-health');
            }

            if (health === 0 && !gameOver) {
                gameOver = true;
                endGame();
            }
        }

        function takePoisonDamage() {
            if (!gameOver) {
                health -= poisonDamage;
                updateHealth();
                statusText.innerHTML = `毒素造成了 <span class="poison-effect">${poisonDamage}</span> 點傷害！`;
            }
        }

        function useHealthPotion() {
            if (!gameOver) {
                health = Math.min(100, health + 10);
                poisonDamage += 1;
                updateHealth();
                statusText.textContent = `你使用了藥水，恢復了10點生命值！但毒素變得更強了...`;
                usePotion.classList.add('shake');
                setTimeout(() => usePotion.classList.remove('shake'), 500);
            }
        }

        function endGame() {
            const gameOverElement = document.createElement('div');
            gameOverElement.classList.add('game-over');
            gameOverElement.textContent = 'GAME OVER';
            document.body.appendChild(gameOverElement);
        }

        usePotion.addEventListener('click', useHealthPotion);
        setInterval(takePoisonDamage, 1000);

        // 初始更新
        updateHealth();
    </script>
</body>

    <!--
    
    # RPG中毒英雄遊戲場景Prompt

    創建一個互動式HTML遊戲場景，描述一個被毒蜘蛛咬傷的RPG英雄。遊戲應該具有以下特點：

    ## 視覺設計
    1. 使用深色背景（深灰或深藍）營造地下城氛圍
    2. 居中的遊戲容器，最大寬度限制在28rem左右
    3. 生命值條使用紅色，背景為深紅色
    4. "使用藥水"按鈕使用藍色，懸停時變暗
    5. 標題和毒素效果使用綠色發光文字

    ## 遊戲機制
    1. 初始生命值為100
    2. 每秒受到毒素傷害（初始為2點）
    3. "使用藥水"按鈕恢復10點生命值
    4. 每次使用藥水後，毒素傷害增加1點
    5. 當生命值降至0時，顯示"GAME OVER"

    ## 互動元素
    1. 實時更新的生命值條和數值顯示
    2. 可點擊的"使用藥水"按鈕
    3. 動態更新的敘述文本，描述當前情況
    4. 生命值低時，生命值條顯示抖動動畫
    5. 使用藥水時，按鈕顯示抖動效果

    ## 動畫效果
    1. 藥水按鈕的脈衝動畫
    2. 生命值條的平滑過渡效果
    3. 遊戲結束時的全屏抖動效果

    ## 響應式設計
    確保遊戲在各種設備上都能正常顯示和運行

    ## 代碼要求
    1. 使用原生HTML、CSS和JavaScript
    2. 避免使用外部庫或框架
    3. 確保代碼簡潔、易讀、結構良好

    創建這個場景時，注重視覺吸引力和遊戲性的平衡，以及清晰的用戶反饋。場景應該傳達出英雄努力對抗毒素，但最終難以避免失敗的緊張感。
    
    -->

</html>
