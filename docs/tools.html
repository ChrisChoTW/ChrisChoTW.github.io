        /* Tools Page Specific Styles */
        
        
        
        .header {
            margin-bottom: 80px;
            max-width: 680px;
            margin-left: auto;
            margin-right: auto;
            text-align: center;
            padding-top: 40px;
        }
        
        .header-top {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 32px;
            gap: 24px;
        }
        
        .header-content h1 {
            font-family: 'Charter', Georgia, serif;
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-primary);
            letter-spacing: -0.03em;
            line-height: 1.1;
        }
        
        .header-content p {
            font-size: 1.125rem;
            color: var(--text-muted);
            max-width: 480px;
            line-height: 1.6;
            margin: 0 auto;
        }
        
        
        .search-section {
            margin-bottom: 60px;
            max-width: 680px;
            margin-left: auto;
            margin-right: auto;
            text-align: center;
        }
        
        .search-container {
            position: relative;
            max-width: 480px;
            margin: 0 auto 32px auto;
        }
        
        .search-input {
            width: 100%;
            padding: 16px 20px 16px 48px;
            background: var(--bg-card);
            border: 1px solid var(--border-primary);
            border-radius: 32px;
            font-size: 16px;
            color: var(--text-primary);
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
        }
        
        .search-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        
        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            color: var(--text-muted);
        }
        
        /* 第一層篩選 */
        .primary-filters {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 24px;
            justify-content: center;
        }
        
        .filter-tag {
            padding: 8px 20px;
            background: var(--bg-card);
            border: 1px solid var(--border-primary);
            border-radius: 24px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            font-family: 'Inter', sans-serif;
        }
        
        .filter-tag:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }
        
        .filter-tag.active {
            background: var(--accent-primary);
            color: white;
            border-color: var(--accent-primary);
        }
        
        /* 進階篩選 */
        .advanced-filters {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            margin-bottom: 32px;
            justify-content: center;
            padding: 24px 0;
            border-top: 1px solid var(--border-muted);
            border-bottom: 1px solid var(--border-muted);
            background: transparent;
        }
        
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 180px;
            max-width: 220px;
        }
        
        .filter-group label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-primary);
            font-family: 'Charter', Georgia, serif;
            margin-bottom: 4px;
        }
        
        .filter-select-single {
            width: 100%;
            min-width: 150px;
        }
        
        .filter-select-multi {
            width: 100%;
            min-width: 200px;
        }
        
        /* 篩選結果 */
        .filter-results {
            font-size: 0.875rem;
            color: var(--text-secondary);
            text-align: center;
            padding: 20px 0;
            background: transparent;
            border-radius: 0;
            border: none;
            font-family: 'Inter', sans-serif;
            margin-bottom: 32px;
        }
        
        #resultCount {
            font-weight: 600;
            color: var(--accent-primary);
        }
        
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 32px;
            margin-bottom: 80px;
        }
        
        .tool-card {
            background: var(--bg-card);
            border: 1px solid var(--border-primary);
            border-radius: var(--radius);
            box-shadow: var(--shadow-card);
            transition: all 0.2s ease;
            overflow: hidden;
            position: relative;
        }
        
        .tool-card:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
        }
        
        /* 預覽按鈕樣式 */
        .preview-button {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 36px;
            height: 36px;
            background: var(--bg-card);
            border: 1px solid var(--border-primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            z-index: 10;
            opacity: 0;
            transform: scale(0.8);
        }
        
        .tool-card:hover .preview-button {
            opacity: 1;
            transform: scale(1);
        }
        
        .preview-button:hover {
            background: var(--accent-primary);
            color: white;
            border-color: var(--accent-primary);
        }
        
        .preview-button i {
            font-size: 0.875rem;
        }
        
        /* Modal 樣式 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
        }
        
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .modal-content {
            background: var(--bg-card);
            border-radius: 16px;
            max-width: 90vw;
            max-height: 90vh;
            width: 800px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }
        
        .modal-overlay.active .modal-content {
            transform: scale(1);
        }
        
        .modal-header {
            padding: 24px 24px 16px 24px;
            border-bottom: 1px solid var(--border-muted);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        
        .modal-title {
            flex: 1;
        }
        
        .modal-title h3 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0 0 8px 0;
        }
        
        .modal-title .tool-category {
            font-size: 0.875rem;
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .modal-close {
            background: none;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.2s ease;
            margin-left: 16px;
        }
        
        .modal-close:hover {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }
        
        .modal-body {
            padding: 0;
        }
        
        .modal-preview {
            width: 100%;
            height: 400px;
            position: relative;
            overflow: hidden;
            background: var(--bg-secondary);
        }
        
        .modal-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .modal-preview-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 1rem;
            text-align: center;
            padding: 2rem;
            background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-card) 100%);
        }
        
        .modal-description {
            padding: 24px;
        }
        
        .modal-description h4 {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0 0 16px 0;
        }
        
        .modal-description p {
            color: var(--text-secondary);
            line-height: 1.6;
            margin: 0 0 20px 0;
        }
        
        .modal-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }
        
        .modal-actions {
            display: flex;
            gap: 12px;
        }
        
        .modal-btn {
            padding: 12px 24px;
            border-radius: 24px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: none;
            cursor: pointer;
        }
        
        .modal-btn-primary {
            background: var(--accent-primary);
            color: white;
        }
        
        .modal-btn-primary:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }
        
        .modal-btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border-primary);
        }
        
        .modal-btn-secondary:hover {
            background: var(--bg-card);
            border-color: var(--accent-primary);
        }
        
        .tool-card a {
            display: block;
            padding: 24px;
            text-decoration: none;
            color: inherit;
        }
        
        .tool-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        
        .tool-icon {
            width: 48px;
            height: 48px;
            background: var(--bg-secondary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .tool-icon i {
            font-size: 1.25rem;
            color: var(--accent-primary);
        }
        
        .tool-title h3 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
            line-height: 1.4;
        }
        
        .tool-category {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 4px;
        }
        
        .tool-description {
            color: var(--text-secondary);
            font-size: 0.875rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        
        .tool-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        
        .tool-card.hidden {
            display: none;
        }
        
        a {
            text-decoration: none;
            color: inherit;
        }
        
        
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Select2 Medium 風格樣式 */

        // 動態生成工具卡片
        function createToolCard(tool) {
            const tagClass = (tag) => {
                if (tag === '新功能') return 'tag new';
                if (tag === 'Beta') return 'tag beta';
                if (tag === '熱門') return 'tag popular';
                return 'tag';
            };

            const tagsHTML = tool.tags.map(tag => 
                `<span class="${tagClass(tag)}">${tag}</span>`
            ).join('');

            // Create icon based on category
            const getIconClass = (category) => {
                switch(category) {
                    case 'tools': return 'fas fa-tools';
                    case 'games': return 'fas fa-gamepad';
                    case 'docs': return 'fas fa-book';
                    case 'learning': return 'fas fa-graduation-cap';
                    default: return 'fas fa-cube';
                }
            };

            return `
                <div class="tool-card" data-id="${tool.id}">
                    <button class="preview-button" onclick="openPreviewModal('${tool.id}')" aria-label="預覽 ${tool.title}">
                        <i class="fas fa-eye"></i>
                    </button>
                    <a href="${tool.url}">
                        <div class="tool-header">
                            <div class="tool-icon">
                                <i class="${getIconClass(tool.category)}"></i>
                            </div>
                            <div class="tool-title">
                                <h3>${tool.title}</h3>
                                <div class="tool-category">${tool.categoryLabel}</div>
                            </div>
                        </div>
                        <div class="tool-description">
                            ${tool.description}
                        </div>
                        <div class="tool-tags">
                            ${tagsHTML}
                        </div>
                    </a>
                </div>
            `;
        }

        // 渲染所有工具卡片
        function renderToolCards(tools = toolsData) {
            const toolsGrid = document.getElementById('toolsGrid');
            toolsGrid.innerHTML = tools.map(tool => createToolCard(tool)).join('');
            
            // 更新結果計數
            const resultCount = document.getElementById('resultCount');
            resultCount.textContent = tools.length;
            
            // 重新應用動畫觀察器
            setupCardAnimations();
        }

        // 設置卡片動畫
        function setupCardAnimations() {
            const toolCards = document.querySelectorAll('.tool-card');
            
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.style.opacity = '1';
                        entry.target.style.transform = 'translateY(0)';
                    }
                });
            }, {
                threshold: 0.1
            });
            
            toolCards.forEach(card => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(20px)';
                card.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
                observer.observe(card);
            });
        }

        
        // 動態生成分類標籤
        function generateCategoryTags() {
            const categories = ['all', ...new Set(toolsData.map(tool => tool.category))];
            const categoryLabels = {
                all: '全部',
                tools: '工具',
                games: '遊戲',
                docs: '文檔',
                learning: '學習'
            };
            
            const primaryFilters = document.querySelector('.primary-filters');
            primaryFilters.innerHTML = categories.map((category, index) => 
                `<div class="filter-tag ${index === 0 ? 'active' : ''}" data-filter="${category}">${categoryLabels[category] || category}</div>`
            ).join('');
        }

        // 篩選系統
        let activeFilters = {
            category: 'all',
            purpose: '',
            technologies: [],
            features: []
        };

        function filterTools() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            const filteredTools = toolsData.filter(tool => {
                // 搜尋詞匹配
                const matchesSearch = searchTerm === '' || 
                    tool.title.toLowerCase().includes(searchTerm) ||
                    tool.description.toLowerCase().includes(searchTerm) ||
                    tool.categoryLabel.toLowerCase().includes(searchTerm) ||
                    tool.purpose.some(p => p.toLowerCase().includes(searchTerm)) ||
                    tool.tech.some(t => t.toLowerCase().includes(searchTerm)) ||
                    tool.features.some(f => f.toLowerCase().includes(searchTerm)) ||
                    tool.tags.some(tag => tag.toLowerCase().includes(searchTerm));
                
                // 分類篩選
                const matchesCategory = activeFilters.category === 'all' || tool.category === activeFilters.category;
                
                // 用途篩選
                const matchesPurpose = activeFilters.purpose === '' || tool.purpose.includes(activeFilters.purpose);
                
                // 技術篩選 (OR)
                const matchesTech = activeFilters.technologies.length === 0 || 
                    activeFilters.technologies.some(tech => tool.tech.includes(tech));
                
                // 特性篩選 (OR)
                const matchesFeatures = activeFilters.features.length === 0 || 
                    activeFilters.features.some(feature => tool.features.includes(feature));
                
                return matchesSearch && matchesCategory && matchesPurpose && matchesTech && matchesFeatures;
            });
            
            renderToolCards(filteredTools);
        }

        // Initialize Select2 and filtering system
        $(document).ready(function() {
            // 生成分類標籤
            generateCategoryTags();
            
            // 初始渲染
            renderToolCards();
            
            // Initialize Select2
            $('#purposeFilter').select2({
                placeholder: '選擇用途...',
                allowClear: true,
                width: '100%'
            });
            
            $('#techFilter').select2({
                placeholder: '選擇技術...',
                allowClear: true,
                width: '100%',
                closeOnSelect: false
            });
            
            $('#featureFilter').select2({
                placeholder: '選擇特性...',
                allowClear: true,
                width: '100%',
                closeOnSelect: false
            });
            
            // 搜尋輸入事件
            document.getElementById('searchInput').addEventListener('input', filterTools);
            
            // 分類標籤點擊事件
            document.querySelector('.primary-filters').addEventListener('click', (e) => {
                if (e.target.classList.contains('filter-tag')) {
                    // 更新活躍狀態
                    document.querySelectorAll('.filter-tag').forEach(tag => tag.classList.remove('active'));
                    e.target.classList.add('active');
                    
                    activeFilters.category = e.target.getAttribute('data-filter');
                    filterTools();
                }
            });
            
            // Select2 事件處理
            $('#purposeFilter').on('select2:select select2:unselect select2:clear', function() {
                activeFilters.purpose = $(this).val() || '';
                filterTools();
            });
            
            $('#techFilter').on('select2:select select2:unselect select2:clear', function() {
                activeFilters.technologies = $(this).val() || [];
                filterTools();
            });
            
            $('#featureFilter').on('select2:select select2:unselect select2:clear', function() {
                activeFilters.features = $(this).val() || [];
                filterTools();
            });
        });

        // Modal 控制函數
        function openPreviewModal(toolId) {
            const tool = toolsData.find(t => t.id === toolId);
            if (!tool) return;

            // 更新 Modal 內容
            document.getElementById('modalTitle').textContent = tool.title;
            document.getElementById('modalCategory').textContent = tool.categoryLabel;
            document.getElementById('modalDescription').textContent = tool.description;
            document.getElementById('modalLaunchBtn').href = tool.url;

            // 處理 PRD 按鈕顯示/隱藏
            const prdBtn = document.getElementById('modalPrdBtn');
            if (tool.prd) {
                prdBtn.href = tool.prd;
                prdBtn.style.display = 'inline-flex';
            } else {
                prdBtn.style.display = 'none';
            }
            
            // 生成標籤
            const tagClass = (tag) => {
                if (tag === '新功能') return 'tag new';
                if (tag === 'Beta') return 'tag beta';
                if (tag === '熱門') return 'tag popular';
                return 'tag';
            };
            
            const modalTags = document.getElementById('modalTags');
            modalTags.innerHTML = tool.tags.map(tag => 
                `<span class="${tagClass(tag)}">${tag}</span>`
            ).join('');
            
            // 載入預覽圖片
            const modalPreview = document.getElementById('modalPreview');
            const screenshotPath = `images/screenshots/${tool.id}.webp`;

            // 檢查是否有預覽圖片，如果沒有則顯示工具圖標和描述
            const previewImg = new Image();
            previewImg.onload = function() {
                modalPreview.innerHTML = `
                    <img src="${screenshotPath}" alt="${tool.title} 預覽">
                `;
            };
            previewImg.onerror = function() {
                modalPreview.innerHTML = `
                    <div class="modal-preview-placeholder">
                        <div class="preview-icon" style="font-size: 3rem; margin-bottom: 1rem;">${tool.icon}</div>
                        <h4 style="margin: 0 0 0.5rem 0; color: var(--text-primary);">${tool.title}</h4>
                        <p style="margin: 0; color: var(--text-secondary); font-size: 0.875rem;">點擊下方按鈕開啟工具體驗完整功能</p>
                    </div>
                `;
            };
            previewImg.src = screenshotPath;
            
            // 顯示 Modal
            const modal = document.getElementById('previewModal');
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        
        function closePreviewModal() {
            const modal = document.getElementById('previewModal');
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }
        
        // 點擊遮罩關閉 Modal
        document.getElementById('previewModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closePreviewModal();
            }
        });
        
        // ESC 鍵關閉 Modal
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closePreviewModal();
            }
        });
    </script>
</body>
</html>
