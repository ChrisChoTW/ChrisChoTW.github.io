        /* Tools Page Specific Styles */
        
        
        
        .header {
            margin-bottom: 80px;
            max-width: 680px;
            margin-left: auto;
            margin-right: auto;
            text-align: center;
            padding-top: 40px;
        }
        
        .header-top {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 32px;
            gap: 24px;
        }
        
        .header-content h1 {
            font-family: 'Charter', Georgia, serif;
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-primary);
            letter-spacing: -0.03em;
            line-height: 1.1;
        }
        
        .header-content p {
            font-size: 1.125rem;
            color: var(--text-muted);
            max-width: 480px;
            line-height: 1.6;
            margin: 0 auto;
        }
        
        
        .search-section {
            margin-bottom: 60px;
            max-width: 680px;
            margin-left: auto;
            margin-right: auto;
            text-align: center;
        }
        
        .search-container {
            position: relative;
            max-width: 480px;
            margin: 0 auto 32px auto;
        }
        
        .search-input {
            width: 100%;
            padding: 16px 20px 16px 48px;
            background: var(--bg-card);
            border: 1px solid var(--border-primary);
            border-radius: 32px;
            font-size: 16px;
            color: var(--text-primary);
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
        }
        
        .search-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        
        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            color: var(--text-muted);
        }
        
        /* 第一層篩選 */
        .primary-filters {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 24px;
            justify-content: center;
        }
        
        .filter-tag {
            padding: 8px 20px;
            background: var(--bg-card);
            border: 1px solid var(--border-primary);
            border-radius: 24px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            font-family: 'Inter', sans-serif;
        }
        
        .filter-tag:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }
        
        .filter-tag.active {
            background: var(--accent-primary);
            color: white;
            border-color: var(--accent-primary);
        }
        
        /* 進階篩選 */
        .advanced-filters {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            margin-bottom: 32px;
            justify-content: center;
            padding: 24px 0;
            border-top: 1px solid var(--border-muted);
            border-bottom: 1px solid var(--border-muted);
            background: transparent;
        }
        
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 180px;
            max-width: 220px;
        }
        
        .filter-group label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-primary);
            font-family: 'Charter', Georgia, serif;
            margin-bottom: 4px;
        }
        
        .filter-select-single {
            width: 100%;
            min-width: 150px;
        }
        
        .filter-select-multi {
            width: 100%;
            min-width: 200px;
        }
        
        /* 篩選結果 */
        .filter-results {
            font-size: 0.875rem;
            color: var(--text-secondary);
            text-align: center;
            padding: 20px 0;
            background: transparent;
            border-radius: 0;
            border: none;
            font-family: 'Inter', sans-serif;
            margin-bottom: 32px;
        }
        
        #resultCount {
            font-weight: 600;
            color: var(--accent-primary);
        }
        
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 32px;
            margin-bottom: 80px;
        }
        
        .tool-card {
            background: var(--bg-card);
            border: 1px solid var(--border-primary);
            border-radius: var(--radius);
            box-shadow: var(--shadow-card);
            transition: all 0.2s ease;
            overflow: hidden;
            position: relative;
        }
        
        .tool-card:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
        }
        
        .tool-card a {
            display: block;
            padding: 24px;
            text-decoration: none;
            color: inherit;
        }
        
        .tool-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        
        .tool-icon {
            width: 48px;
            height: 48px;
            background: var(--bg-secondary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .tool-icon i {
            font-size: 1.25rem;
            color: var(--accent-primary);
        }
        
        .tool-title h3 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
            line-height: 1.4;
        }
        
        .tool-category {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 4px;
        }
        
        .tool-description {
            color: var(--text-secondary);
            font-size: 0.875rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        
        .tool-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        
        .tool-card.hidden {
            display: none;
        }
        
        a {
            text-decoration: none;
            color: inherit;
        }
        
        
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Select2 Medium 風格樣式 */
        .select2-container--default .select2-selection--single {
            background-color: var(--bg-card);
            border: 1px solid var(--border-primary);
            border-radius: 24px;
            color: var(--text-primary);
            height: 44px;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
        }
        
        .select2-container--default .select2-selection--single:focus-within {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .select2-container--default .select2-selection--single .select2-selection__clear {
            margin-right: 0px;
            margin-left: 10px;
            margin-top: 10px;
            float: left;
        }
        
        .select2-container--default .select2-search--inline .select2-search__field {
            height: 24px;
            padding-top: 2px;
            padding-left: 10px;
        }

        
        .select2-container--default .select2-selection--single .select2-selection__rendered {
            color: var(--text-primary);
            line-height: 42px;

            font-family: 'Inter', sans-serif;
            font-size: 0.875rem;
        }
        
        .select2-container--default .select2-selection--single .select2-selection__arrow {
            height: 42px;
            right: 16px;
        }
        
        .select2-container--default .select2-selection--single .select2-selection__arrow b {
            border-color: var(--text-muted) transparent transparent transparent;
        }
        
        .select2-container--default .select2-selection--multiple {
            background-color: var(--bg-card);
            border: 1px solid var(--border-primary);
            border-radius: 24px;
            color: var(--text-primary);
            min-height: 44px;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
        }
        
        .select2-container--default .select2-selection--multiple:focus-within {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        
        .select2-container--default .select2-selection--multiple .select2-selection__choice {
            background-color: var(--accent-primary);
            color: white;
            border: none;
            border-radius: 16px;
            padding: 4px 12px;
            margin: 6px 6px 0 0;
            font-family: 'Inter', sans-serif;
            font-size: 0.75rem;
            font-weight: 500;
        }
        
        .select2-container--default .select2-selection--multiple .select2-selection__choice__remove {
            color: white;
            border-right: none;
            margin-right: 5px;
            padding-right: 0;
        }
        
        .select2-container--default .select2-selection--multiple .select2-selection__choice__remove:hover {
            background-color: transparent;
            color: rgba(255, 255, 255, 0.8);
        }
        
        .select2-dropdown {
            background-color: var(--bg-card);
            border: 1px solid var(--border-primary);
            border-radius: 12px;
            box-shadow: var(--shadow-hover);
            font-family: 'Inter', sans-serif;
        }
        
        .select2-container--default .select2-results__option {
            background-color: var(--bg-card);
            color: var(--text-primary);
            padding: 12px 20px;
            font-size: 0.875rem;
            transition: all 0.2s ease;
        }
        
        .select2-container--default .select2-results__option--highlighted {
            background-color: var(--bg-secondary);
            color: var(--text-primary);
        }
        
        .select2-container--default .select2-results__option[aria-selected="true"] {
            background-color: var(--bg-secondary);
            color: var(--text-primary);
        }
        
        .select2-search--dropdown .select2-search__field {
            background-color: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-primary);
            border-radius: 20px;
            padding: 8px 16px;
            font-family: 'Inter', sans-serif;
        }
        
        .select2-search--dropdown .select2-search__field:focus {
            border-color: var(--accent-primary);
            outline: none;
        }

        @media (max-width: 768px) {
            
            .header-top {
                flex-direction: column;
                gap: 16px;
                align-items: center;
            }
            
            .header-content h1 {
                font-size: 1.875rem;
            }
            
            .tools-grid {
                grid-template-columns: 1fr;
                gap: 24px;
            }
            
            .search-container {
                max-width: 100%;
            }
            
            .advanced-filters {
                flex-direction: column;
                gap: 12px;
            }
            
            .filter-group {
                min-width: auto;
            }
        }
    </style>

        // 動態生成工具卡片
        function createToolCard(tool) {
            const tagClass = (tag) => {
                if (tag === '新功能') return 'tag new';
                if (tag === 'Beta') return 'tag beta';
                if (tag === '熱門') return 'tag popular';
                return 'tag';
            };

            const tagsHTML = tool.tags.map(tag => 
                `<span class="${tagClass(tag)}">${tag}</span>`
            ).join('');

            // Create icon based on category
            const getIconClass = (category) => {
                switch(category) {
                    case 'tools': return 'fas fa-tools';
                    case 'games': return 'fas fa-gamepad';
                    case 'docs': return 'fas fa-book';
                    default: return 'fas fa-cube';
                }
            };

            return `
                <div class="tool-card" data-id="${tool.id}">
                    <a href="${tool.url}">
                        <div class="tool-header">
                            <div class="tool-icon">
                                <i class="${getIconClass(tool.category)}"></i>
                            </div>
                            <div class="tool-title">
                                <h3>${tool.title}</h3>
                                <div class="tool-category">${tool.categoryLabel}</div>
                            </div>
                        </div>
                        <div class="tool-description">
                            ${tool.description}
                        </div>
                        <div class="tool-tags">
                            ${tagsHTML}
                        </div>
                    </a>
                </div>
            `;
        }

        // 渲染所有工具卡片
        function renderToolCards(tools = toolsData) {
            const toolsGrid = document.getElementById('toolsGrid');
            toolsGrid.innerHTML = tools.map(tool => createToolCard(tool)).join('');
            
            // 更新結果計數
            const resultCount = document.getElementById('resultCount');
            resultCount.textContent = tools.length;
            
            // 重新應用動畫觀察器
            setupCardAnimations();
        }

        // 設置卡片動畫
        function setupCardAnimations() {
            const toolCards = document.querySelectorAll('.tool-card');
            
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.style.opacity = '1';
                        entry.target.style.transform = 'translateY(0)';
                    }
                });
            }, {
                threshold: 0.1
            });
            
            toolCards.forEach(card => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(20px)';
                card.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
                observer.observe(card);
            });
        }

        
        // 動態生成分類標籤
        function generateCategoryTags() {
            const categories = ['all', ...new Set(toolsData.map(tool => tool.category))];
            const categoryLabels = {
                all: '全部',
                tools: '工具',
                games: '遊戲',
                docs: '文檔'
            };
            
            const primaryFilters = document.querySelector('.primary-filters');
            primaryFilters.innerHTML = categories.map((category, index) => 
                `<div class="filter-tag ${index === 0 ? 'active' : ''}" data-filter="${category}">${categoryLabels[category] || category}</div>`
            ).join('');
        }

        // 篩選系統
        let activeFilters = {
            category: 'all',
            purpose: '',
            technologies: [],
            features: []
        };

        function filterTools() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            const filteredTools = toolsData.filter(tool => {
                // 搜尋詞匹配
                const matchesSearch = searchTerm === '' || 
                    tool.title.toLowerCase().includes(searchTerm) ||
                    tool.description.toLowerCase().includes(searchTerm) ||
                    tool.categoryLabel.toLowerCase().includes(searchTerm) ||
                    tool.purpose.some(p => p.toLowerCase().includes(searchTerm)) ||
                    tool.tech.some(t => t.toLowerCase().includes(searchTerm)) ||
                    tool.features.some(f => f.toLowerCase().includes(searchTerm)) ||
                    tool.tags.some(tag => tag.toLowerCase().includes(searchTerm));
                
                // 分類篩選
                const matchesCategory = activeFilters.category === 'all' || tool.category === activeFilters.category;
                
                // 用途篩選
                const matchesPurpose = activeFilters.purpose === '' || tool.purpose.includes(activeFilters.purpose);
                
                // 技術篩選 (OR)
                const matchesTech = activeFilters.technologies.length === 0 || 
                    activeFilters.technologies.some(tech => tool.tech.includes(tech));
                
                // 特性篩選 (OR)
                const matchesFeatures = activeFilters.features.length === 0 || 
                    activeFilters.features.some(feature => tool.features.includes(feature));
                
                return matchesSearch && matchesCategory && matchesPurpose && matchesTech && matchesFeatures;
            });
            
            renderToolCards(filteredTools);
        }

        // Initialize Select2 and filtering system
        $(document).ready(function() {
            // 生成分類標籤
            generateCategoryTags();
            
            // 初始渲染
            renderToolCards();
            
            // Initialize Select2
            $('#purposeFilter').select2({
                placeholder: '選擇用途...',
                allowClear: true,
                width: '100%'
            });
            
            $('#techFilter').select2({
                placeholder: '選擇技術...',
                allowClear: true,
                width: '100%',
                closeOnSelect: false
            });
            
            $('#featureFilter').select2({
                placeholder: '選擇特性...',
                allowClear: true,
                width: '100%',
                closeOnSelect: false
            });
            
            // 搜尋輸入事件
            document.getElementById('searchInput').addEventListener('input', filterTools);
            
            // 分類標籤點擊事件
            document.querySelector('.primary-filters').addEventListener('click', (e) => {
                if (e.target.classList.contains('filter-tag')) {
                    // 更新活躍狀態
                    document.querySelectorAll('.filter-tag').forEach(tag => tag.classList.remove('active'));
                    e.target.classList.add('active');
                    
                    activeFilters.category = e.target.getAttribute('data-filter');
                    filterTools();
                }
            });
            
            // Select2 事件處理
            $('#purposeFilter').on('select2:select select2:unselect select2:clear', function() {
                activeFilters.purpose = $(this).val() || '';
                filterTools();
            });
            
            $('#techFilter').on('select2:select select2:unselect select2:clear', function() {
                activeFilters.technologies = $(this).val() || [];
                filterTools();
            });
            
            $('#featureFilter').on('select2:select select2:unselect select2:clear', function() {
                activeFilters.features = $(this).val() || [];
                filterTools();
            });
        });
    </script>
</body>
</html>
