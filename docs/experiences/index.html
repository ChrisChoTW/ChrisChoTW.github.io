    <!-- Theme script -->
    <script src="../js/theme.js"></script>

    <style>
        /* 經驗分享頁面專用樣式 */
        .experiences-header {
            text-align: center;
            margin-bottom: 60px;
            max-width: 680px;
            margin-left: auto;
            margin-right: auto;
            padding-top: 40px;
        }

        .experiences-header h1 {
            font-family: 'Charter', Georgia, serif;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-primary);
            letter-spacing: -0.03em;
            line-height: 1.1;
        }

        .experiences-header p {
            font-family: 'Inter', sans-serif;
            font-size: 1.125rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        /* 搜尋與篩選區 */
        .filter-section {
            background: var(--bg-secondary);
            border: 1px solid var(--border-muted);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 40px;
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
        }

        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 140px;
        }

        .filter-group label {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .filter-select, .filter-input {
            padding: 8px 12px;
            border: 1px solid var(--border-muted);
            border-radius: 6px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        .filter-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 16px;
        }

        .filter-tag {
            padding: 4px 12px;
            background: var(--accent-primary);
            color: white;
            border-radius: 16px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-tag:hover {
            opacity: 0.8;
        }

        .filter-tag.active {
            background: var(--text-primary);
        }

        /* 經驗卡片網格 */
        .experiences-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 24px;
            margin-bottom: 60px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        .experience-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-muted);
            border-radius: 12px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .experience-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            border-color: var(--accent-primary);
        }

        .experience-card .category-badge {
            position: absolute;
            top: 16px;
            right: 16px;
            padding: 4px 10px;
            background: var(--accent-primary);
            color: white;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .experience-card h3 {
            font-family: 'Inter', sans-serif;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 12px;
            margin-right: 80px;
            line-height: 1.3;
        }

        .experience-card .summary {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 16px;
        }

        .experience-card .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .experience-card .meta-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .experience-card .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 12px;
        }

        .experience-card .tag {
            padding: 3px 8px;
            background: var(--bg-primary);
            border: 1px solid var(--border-muted);
            border-radius: 10px;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        /* Modal 樣式 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            overflow-y: auto;
        }

        .modal-content {
            background: var(--bg-primary);
            max-width: 1000px;
            width: 90%;
            margin: 40px auto;
            border-radius: 12px;
            position: relative;
            max-height: calc(100vh - 80px);
            overflow-y: auto;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .modal-header {
            padding: 24px 24px 0 24px;
            border-bottom: 1px solid var(--border-muted);
            position: sticky;
            top: 0;
            background: var(--bg-primary);
            z-index: 1;
        }

        .modal-header h2 {
            font-family: 'Charter', Georgia, serif;
            font-size: 1.5rem;
            color: var(--text-primary);
            margin: 0 40px 16px 0;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
        }

        .modal-body {
            padding: 32px;
            color: var(--text-primary);
            font-size: 1rem;
            line-height: 1.7;
        }

        .modal-body h1, .modal-body h2, .modal-body h3, .modal-body h4 {
            color: var(--text-primary);
            margin-top: 32px;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .modal-body h1:first-child,
        .modal-body h2:first-child,
        .modal-body h3:first-child {
            margin-top: 0;
        }

        .modal-body h1 { font-size: 1.75rem; }
        .modal-body h2 { font-size: 1.5rem; }
        .modal-body h3 { font-size: 1.25rem; }

        .modal-body p {
            color: var(--text-secondary);
            line-height: 1.7;
            margin-bottom: 16px;
        }

        .modal-body li {
            color: var(--text-secondary);
            line-height: 1.7;
            margin-bottom: 8px;
            padding-left: 4px;
        }

        .modal-body ul, .modal-body ol {
            margin-bottom: 20px;
            padding-left: 24px;
        }

        .modal-body ul li {
            list-style-type: disc;
            margin-left: 0;
        }

        .modal-body ol li {
            list-style-type: decimal;
            margin-left: 0;
        }

        .modal-body code {
            background: var(--bg-secondary);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9em;
        }

        .modal-body pre {
            background: var(--bg-secondary);
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 16px 0;
        }

        .modal-body pre code {
            background: none;
            padding: 0;
        }

        .modal-body blockquote {
            background: var(--bg-secondary);
            border-left: 4px solid var(--text-accent, #3b82f6);
            padding: 16px 20px;
            margin: 20px 0;
            border-radius: 0 8px 8px 0;
            font-style: italic;
        }

        .modal-body blockquote p {
            margin-bottom: 0;
            color: var(--text-primary);
        }

        .modal-body strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        .modal-body a {
            color: var(--text-accent, #3b82f6);
            text-decoration: none;
        }

        .modal-body a:hover {
            text-decoration: underline;
        }

        /* 響應式 Modal 設計 */
        @media (max-width: 768px) {
            .modal-content {
                width: 95%;
                margin: 20px auto;
                max-height: calc(100vh - 40px);
            }

            .modal-body {
                padding: 20px;
                font-size: 0.95rem;
            }

            .modal-header h2 {
                font-size: 1.3rem;
            }
        }

        /* Loading 樣式 */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }

        .loading i {
            font-size: 2rem;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 響應式設計 */
        @media (max-width: 768px) {
            .experiences-header h1 {
                font-size: 2rem;
            }

            .filter-row {
                flex-direction: column;
                align-items: stretch;
            }

            .filter-group {
                min-width: 100%;
            }

            .experiences-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .experience-card {
                padding: 20px;
            }

            .modal-content {
                margin: 20px;
                max-width: calc(100% - 40px);
            }
        }
    </style>
</head>

        <div class="experiences-header">

                <i class="fas fa-lightbulb" style="color: var(--accent-primary); margin-right: 12px;"></i>

        <!-- 搜尋與篩選區 -->
        <div class="filter-section">
            <div class="filter-row">
                <div class="filter-group">
                    <label for="categoryFilter">問題類型</label>
                    <select id="categoryFilter" class="filter-select">
                        <option value="">全部類型</option>
                        <option value="CSS">CSS</option>
                        <option value="JavaScript">JavaScript</option>
                        <option value="React">React</option>
                        <option value="架構設計">架構設計</option>
                        <option value="協作技巧">協作技巧</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="difficultyFilter">難度等級</label>
                    <select id="difficultyFilter" class="filter-select">
                        <option value="">全部難度</option>
                        <option value="初級">初級</option>
                        <option value="中級">中級</option>
                        <option value="高級">高級</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="searchInput">關鍵字搜尋</label>
                    <input type="text" id="searchInput" class="filter-input" placeholder="搜尋標題或內容...">
                </div>
            </div>
            <div class="filter-tags" id="activeTags"></div>

        <!-- 經驗卡片網格 -->

                    <button class="modal-close" onclick="closeModal()">&times;</button>

                <div class="modal-body" id="modalBody">
                    <div class="loading">
