<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPI 指標分析工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .subtitle {
            color: rgba(255,255,255,0.9);
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        
        .main-content {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .section-title {
            font-size: 1.2em;
            color: #4b5563;
            margin-bottom: 15px;
            padding: 10px 0;
            border-bottom: 2px solid #e5e7eb;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .input-section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        .section-title {
            font-size: 1.3em;
            color: #4b5563;
            margin-bottom: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .dimension {
            margin-bottom: 25px;
        }
        
        .dimension-label {
            font-weight: 500;
            color: #374151;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .indicator-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
        }
        
        .indicator {
            background: #f3f4f6;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
            font-size: 0.9em;
            text-align: center;
        }
        
        .indicator:hover {
            background: #e5e7eb;
            transform: translateY(-2px);
        }
        
        .indicator.selected {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #4c1d95;
            font-weight: 500;
        }
        
        .slider-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .slider {
            flex: 1;
            height: 8px;
            border-radius: 5px;
            outline: none;
            background: linear-gradient(to right, 
                #10b981 0%, 
                #10b981 33%, 
                #f59e0b 33%, 
                #f59e0b 66%, 
                #ef4444 66%, 
                #ef4444 100%);
            -webkit-appearance: none;
        }
        
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            border: 3px solid #6366f1;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        
        .slider::-moz-range-thumb {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            border: 3px solid #6366f1;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        
        .slider-value {
            font-weight: 600;
            color: #4b5563;
            min-width: 40px;
            text-align: center;
        }
        
        
        .diagnosis-section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        .diagnosis-empty {
            text-align: center;
            color: #9ca3af;
            padding: 40px;
        }
        
        .diagnosis-result {
            display: none;
        }
        
        .diagnosis-result.show {
            display: block;
        }
        
        .severity {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            margin-left: 10px;
        }
        
        .severity.critical {
            background: #fef2f2;
            color: #991b1b;
        }
        
        .severity.warning {
            background: #fef3c7;
            color: #92400e;
        }
        
        .severity.info {
            background: #dbeafe;
            color: #1e40af;
        }
        
        .diagnosis-item {
            background: #f9fafb;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #6366f1;
        }
        
        .diagnosis-title {
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .diagnosis-desc {
            color: #6b7280;
            margin-bottom: 10px;
            line-height: 1.5;
        }
        
        .diagnosis-action {
            background: white;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
        }
        
        .diagnosis-action-title {
            font-weight: 500;
            color: #059669;
            margin-bottom: 5px;
            font-size: 0.9em;
        }
        
        .diagnosis-action-text {
            color: #374151;
            font-size: 0.95em;
        }
        
        .score-display {
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .score-label {
            color: #6b7280;
            font-size: 0.9em;
            margin-bottom: 10px;
        }
        
        .score-value {
            font-size: 3em;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .reset-button {
            padding: 10px 20px;
            background: #6b7280;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
        }

        .reset-button:hover {
            background: #4b5563;
        }

        /* KPI 網格卡片樣式 */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
            margin: 30px 0;
        }

        .kpi-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            position: relative;
        }

        .kpi-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.2);
            border-color: #667eea;
        }

        .kpi-card.hidden {
            display: none;
        }

        .kpi-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .kpi-card-title {
            font-size: 1.1em;
            font-weight: 600;
            color: #1f2937;
            line-height: 1.3;
        }

        .kpi-card-category {
            background: #f3f4f6;
            color: #6b7280;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: 500;
            white-space: nowrap;
            margin-left: 10px;
        }

        .kpi-card-preview {
            color: #6b7280;
            font-size: 0.9em;
            line-height: 1.4;
            margin-top: 8px;
        }

        .click-hint {
            position: absolute;
            bottom: 15px;
            right: 15px;
            background: rgba(102, 126, 234, 0.1);
            color: #667eea;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.75em;
            font-weight: 500;
            opacity: 0.8;
        }

        .kpi-card:hover .click-hint {
            background: #667eea;
            color: white;
            opacity: 1;
        }

        /* Modal 樣式 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 700px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            animation: modalSlideIn 0.3s ease;
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #f3f4f6;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            background: #e5e7eb;
            transform: scale(1.1);
        }

        .modal-header {
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e5e7eb;
        }

        .modal-title {
            font-size: 1.5em;
            color: #1f2937;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding-right: 40px;
        }

        .modal-category {
            background: #667eea;
            color: white;
            padding: 6px 14px;
            border-radius: 15px;
            font-size: 0.85em;
            font-weight: 500;
        }

        .modal-section {
            margin-bottom: 25px;
        }

        .modal-section h4 {
            margin-bottom: 12px;
            font-size: 1.15em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-content-block {
            padding: 18px 22px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 0.95em;
        }

        .positive-section .modal-content-block {
            background: #ecfdf5;
            border-left: 4px solid #22c55e;
            color: #15803d;
        }

        .consideration-section .modal-content-block {
            background: #fef3c7;
            border-left: 4px solid #f59e0b;
            color: #92400e;
        }

        .suggestion-section .modal-content-block {
            background: #dbeafe;
            border-left: 4px solid #3b82f6;
            color: #1d4ed8;
        }

        .modal-navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
        }

        .nav-btn {
            padding: 8px 16px;
            background: #f3f4f6;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9em;
        }

        .nav-btn:hover:not(:disabled) {
            background: #667eea;
            color: white;
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .modal-counter {
            font-size: 0.9em;
            color: #6b7280;
            font-weight: 500;
        }
        
        /* 篩選與搜尋樣式 */
        .filter-section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        .search-bar {
            margin: 20px 0;
            display: flex;
            justify-content: center;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-input {
            padding: 12px 20px;
            border: 2px solid #e5e7eb;
            border-radius: 25px;
            font-size: 1em;
            min-width: 300px;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .analyze-button {
            padding: 10px 25px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 150px;
        }

        .analyze-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3);
        }

        .analyze-button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-top: 20px;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.95em;
            font-weight: 500;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
        }

        /* 卡片區域樣式 */
        .kpi-sections {
            margin: 30px 0;
        }

        .selected-section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.2em;
            color: #4b5563;
            margin-bottom: 15px;
            padding: 10px 0;
            border-bottom: 2px solid #e5e7eb;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .selected-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
            min-height: 60px;
            padding: 15px;
            background: #f0fdf4;
            border-radius: 12px;
            border: 2px dashed #22c55e;
        }

        .no-selection {
            grid-column: 1 / -1;
            text-align: center;
            color: #9ca3af;
            font-style: italic;
            padding: 20px;
        }

        .candidate-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 15px;
        }

        /* 分層卡片樣式 */
        .kpi-card {
            background: white;
            border-radius: 12px;
            padding: 14px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            position: relative;
        }

        .kpi-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.2);
        }

        .kpi-card.selected {
            border-color: #667eea;
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.3);
        }

        .kpi-card.hidden {
            display: none;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .kpi-title {
            font-size: 1.1em;
            font-weight: 600;
            color: #1f2937;
            flex: 1;
        }

        .category-tag {
            background: #f3f4f6;
            color: #6b7280;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.75em;
            font-weight: 500;
            margin-left: 10px;
        }

        .kpi-card.selected .category-tag {
            background: #667eea;
            color: white;
        }

        /* API Key 輸入區域樣式 */
        .api-key-section {
            max-width: 500px;
            margin: 20px auto;
            padding: 16px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .api-key-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .api-key-label {
            color: white;
            font-size: 0.9em;
            font-weight: 500;
            opacity: 0.9;
        }

        .api-key-input {
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.9);
            font-size: 0.95em;
            transition: all 0.3s ease;
        }

        .api-key-input:focus {
            outline: none;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.3);
        }

        .api-key-link {
            color: #a5b4fc;
            font-size: 0.85em;
            text-decoration: none;
            align-self: flex-end;
            transition: color 0.3s ease;
        }

        .api-key-link:hover {
            color: white;
        }

        /* 工程師取巧規避區域樣式 */
        .hack-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
        }

        .hack-button {
            width: 100%;
            padding: 12px 20px;
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .hack-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }

        .hack-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .hack-content {
            margin-top: 16px;
            padding: 20px;
            background: #fffbeb;
            border-radius: 12px;
            display: none;
            animation: slideDown 0.3s ease;
        }

        .hack-content.show {
            display: block;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hack-title {
            font-size: 1.1em;
            font-weight: 600;
            color: #92400e;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hack-tricks {
            list-style: none;
            padding: 0;
            margin: 12px 0;
        }

        .hack-tricks li {
            padding: 10px;
            margin: 8px 0;
            background: white;
            border-radius: 8px;
            border-left: 4px solid #f59e0b;
            color: #451a03;
            font-size: 0.95em;
        }

        .hack-warning {
            margin-top: 16px;
            padding: 12px;
            background: #fee2e2;
            border-radius: 8px;
            color: #991b1b;
            font-size: 0.9em;
            border-left: 4px solid #dc2626;
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes slideToSelected {
            from {
                transform: translateX(0) translateY(0);
            }
            to {
                transform: translateX(0) translateY(-10px);
            }
        }

        .kpi-card.moving {
            animation: slideToSelected 0.4s ease;
        }
        
        /* TagCloud 標籤樣式 */
        .tagcloud {
            font-family: inherit;
            cursor: pointer;
        }
        
        .tagcloud--item {
            color: #4b5563 !important;
            transition: all 0.3s ease !important;
        }
        
        .tagcloud--item:hover {
            color: #667eea !important;
            transform: scale(1.1) !important;
        }
        
        .tagcloud--item.selected {
            color: #dc2626 !important;
            font-weight: bold !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 KPI 指標分析工具</h1>
        <p class="subtitle">選擇你們團隊表現良好的 KPI 指標，了解這些指標可能的問題與改善建議</p>

        <!-- API Key 輸入區域 -->
        <div class="api-key-section">
            <div class="api-key-container">
                <label for="gemini-api-key" class="api-key-label">Google AI Studio API Key</label>
                <input type="password"
                       id="gemini-api-key"
                       class="api-key-input"
                       placeholder="輸入你的 API Key 來解鎖工程師取巧規避智慧">
                <a href="https://aistudio.google.com/app/apikey"
                   target="_blank"
                   class="api-key-link">取得 API Key →</a>
            </div>
        </div>

        <div class="main-content">
            <!-- 篩選與搜尋區域 -->
            <div class="filter-section">
                <h2 style="color: #4b5563; margin-bottom: 15px; font-size: 1.3em;">💡 快速找到問題 KPI，理性對談主管</h2>
                <p style="color: #6b7280; margin-bottom: 20px;">點擊任意指標查看潛在問題與改善建議</p>

                <!-- 搜尋欄 -->
                <div class="search-bar">
                    <input type="text" class="search-input" id="searchInput" placeholder="搜尋 KPI 指標名稱...">
                </div>

                <!-- 分類篩選按鈕 -->
                <div class="filter-buttons">
                    <button class="filter-btn active" data-category="all">全部類別</button>
                    <button class="filter-btn" data-category="開發活動">開發活動</button>
                    <button class="filter-btn" data-category="Bug與品質">Bug與品質</button>

            generateKpiGrid();
            setupFilterButtons();
            setupSearchInput();
            setupModalSystem();
            setupHackButton();

        // 產生 KPI 網格
        function generateKpiGrid() {
            const kpiGrid = document.getElementById('kpiGrid');
            kpiGrid.innerHTML = '';

            filteredKpiData.forEach((kpi, index) => {
                const kpiCard = document.createElement('div');
                kpiCard.className = 'kpi-card';
                kpiCard.dataset.id = kpi.id;
                kpiCard.dataset.index = index;
                kpiCard.dataset.category = kpi.category;

                const severityClass = getSeverityClass(kpi.severity);

                kpiCard.innerHTML = `
                    <div class="card-header">
                        <div class="kpi-title">${kpi.name}</div>
                        <div class="category-tag">${kpi.category}</div>
                    </div>
                    <div class="severity ${severityClass}">${getSeverityText(kpi.severity)}</div>
                `;

                // 添加點擊事件開啟 Modal
                kpiCard.addEventListener('click', () => openModal(index));

                kpiGrid.appendChild(kpiCard);
            });
        }

        // 取得嚴重程度樣式類別
        function getSeverityClass(severity) {
            const severityMap = {
                'critical': 'critical',
                'warning': 'warning',
                'info': 'info'
            };
            return severityMap[severity] || 'info';
        }

        // 取得嚴重程度文字
        function getSeverityText(severity) {
            const severityMap = {
                'critical': '🔴 需重視',
                'warning': '🟡 需注意',
                'info': '🔵 參考'
            };
            return severityMap[severity] || '🔵 參考';
        }

        // 設置 Modal 系統
        function setupModalSystem() {
            const modal = document.getElementById('kpiModal');
            const closeBtn = document.getElementById('modalClose');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            // 關閉 Modal
            closeBtn.addEventListener('click', closeModal);
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal();
            });

            // 鍵盤導航
            document.addEventListener('keydown', (e) => {
                if (!modal.style.display || modal.style.display === 'none') return;

                switch(e.key) {
                    case 'Escape':
                        closeModal();
                        break;
                    case 'ArrowLeft':
                        navigateModal(-1);
                        break;
                    case 'ArrowRight':
                        navigateModal(1);
                        break;
                }
            });

            // 導航按鈕
            prevBtn.addEventListener('click', () => navigateModal(-1));
            nextBtn.addEventListener('click', () => navigateModal(1));
        }

        // 開啟 Modal
        function openModal(index) {
            currentModalIndex = index;
            const kpi = filteredKpiData[index];
            if (!kpi) return;

            // 更新 Modal 內容
            document.getElementById('modalTitleText').textContent = kpi.name;
            document.getElementById('modalCategory').textContent = kpi.category;
            document.getElementById('modalPositive').textContent = kpi.positive;
            document.getElementById('modalConsideration').textContent = kpi.consideration;
            document.getElementById('modalSuggestion').textContent = kpi.suggestion;

            // 重置取巧規避區域
            resetHackSection();

            // 更新導航狀態
            updateModalNavigation();

            // 顯示 Modal
            const modal = document.getElementById('kpiModal');
            modal.style.display = 'flex';

            // 防止背景滾動
            document.body.style.overflow = 'hidden';
        }

        // 關閉 Modal
        function closeModal() {
            const modal = document.getElementById('kpiModal');
            modal.style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        // Modal 導航
        function navigateModal(direction) {
            const newIndex = currentModalIndex + direction;

            if (newIndex >= 0 && newIndex < filteredKpiData.length) {
                // 在切換之前重置取巧規避區域
                resetHackSection();
                openModal(newIndex);
            }
        }

        // 更新 Modal 導航狀態
        function updateModalNavigation() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const counter = document.getElementById('modalCounter');

            // 更新計數器
            counter.textContent = `${currentModalIndex + 1} / ${filteredKpiData.length}`;

            // 更新按鈕狀態
            prevBtn.disabled = currentModalIndex <= 0;
            nextBtn.disabled = currentModalIndex >= filteredKpiData.length - 1;
        }

        // 設置篩選按鈕
        function setupFilterButtons() {
            const filterButtons = document.querySelectorAll('.filter-btn');
            filterButtons.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    // 更新按鈕狀態
                    filterButtons.forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');

                    // 應用篩選
                    const category = e.target.dataset.category;
                    currentFilter = category;
                    applyFilters();
                });
            });
        }

        // 設置搜尋輸入框
        function setupSearchInput() {
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', (e) => {
                searchTerm = e.target.value.toLowerCase();
                applyFilters();
            });
        }

        // 應用篩選（包含分類和搜尋）
        function applyFilters() {
            // 篩選數據
            filteredKpiData = kpiData.filter(kpi => {
                // 檢查分類篩選
                const categoryMatch = currentFilter === 'all' || kpi.category === currentFilter;

                // 檢查搜尋關鍵字
                const searchMatch = searchTerm === '' ||
                                  kpi.name.toLowerCase().includes(searchTerm) ||
                                  kpi.category.toLowerCase().includes(searchTerm);

                return categoryMatch && searchMatch;
            });

            // 重新產生網格
            generateKpiGrid();
        }

        // 設置取巧規避按鈕
        function setupHackButton() {
            const hackButton = document.getElementById('hackButton');
            const hackContent = document.getElementById('hackContent');

            hackButton.addEventListener('click', async () => {
                const apiKey = document.getElementById('gemini-api-key').value.trim();

                if (!apiKey) {
                    alert('請先輸入 Google AI Studio API Key！');
                    document.getElementById('gemini-api-key').focus();
                    return;
                }

                // 切換展開/收合狀態
                if (hackContent.classList.contains('show')) {
                    hackContent.classList.remove('show');
                    return;
                }

                // 取得當前 KPI 資料
                const kpi = filteredKpiData[currentModalIndex];
                if (!kpi) return;

                // 顯示載入中
                hackButton.disabled = true;
                hackButton.innerHTML = '<span class="loading-spinner"></span> 正在產生取巧規避祕籍...';

                try {
                    const hackData = await generateHackContent(kpi, apiKey);
                    displayHackContent(hackData);
                    hackContent.classList.add('show');
                } catch (error) {
                    console.error('生成取巧規避內容失敗:', error);
                    alert('生成失敗，請檢查 API Key 或稍後再試');
                } finally {
                    hackButton.disabled = false;
                    hackButton.innerHTML = '<span>🎯 工程師如何取巧規避這個 KPI</span>';
                }
            });
        }

        async function generateHackContent(kpi, apiKey) {
            const prompt = `
你是一位資深工程師，熱情的 KPI 策略專家。請務必使用正體中文（繁體中文）回應。

給定的 KPI：${kpi.name}
KPI 描述：${kpi.positive}

請以幽默但實用的方式，提供工程師如何「取巧規避」這個 KPI 的方法。

請以 JSON 格式回應：
{
  "tricks": [
    "取巧規避手段1",
    "取巧規避手段2",
    "取巧規避手段3"
  ],
  "story": "一個簡短的真實（或看似真實）故事，描述某個工程師如何成功操作這個 KPI",
  "warning": "這樣做的風險和後果"
}

重點：
1. 取巧規避手段要具體、可操作，但不要真的鼓勵不道德行為
2. 故事要有趣、真實感
3. 警告要中肯、實用
4. 保持幽默但專業的語氣
5. 務必使用正體中文（繁體中文），不要使用簡體中文
            `;

            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    contents: [{
                        parts: [{
                            text: prompt
                        }]
                    }],
                    generationConfig: {
                        temperature: 0.9,
                        topK: 40,
                        topP: 0.95,
                        maxOutputTokens: 1024,
                        responseMimeType: "application/json"
                    }
                })
            });

            if (!response.ok) {
                throw new Error(`API 請求失敗: ${response.status}`);
            }

            const result = await response.json();
            const content = result.candidates[0].content.parts[0].text;
            return JSON.parse(content);
        }

        // 重置取巧規避區域
        function resetHackSection() {
            const hackContent = document.getElementById('hackContent');
            const hackButton = document.getElementById('hackButton');

            // 清空內容並隱藏
            hackContent.classList.remove('show');
            hackContent.innerHTML = '';

            // 重置按鈕狀態
            hackButton.disabled = false;
            hackButton.innerHTML = '<span>🎯 工程師如何取巧規避這個 KPI</span>';
        }

        // 顯示取巧規避內容
        function displayHackContent(data) {
            const hackContent = document.getElementById('hackContent');

            const tricksHtml = data.tricks.map(trick =>
                `<li>${trick}</li>`
            ).join('');

            hackContent.innerHTML = `
                <div class="hack-title">
                    <span>🎯 取巧規避手段</span>
                </div>
                <ul class="hack-tricks">
                    ${tricksHtml}
                </ul>

                <div class="hack-title">
                    <span>📚 真實故事</span>
                </div>
                <div style="padding: 12px; background: white; border-radius: 8px; color: #451a03; font-size: 0.95em; line-height: 1.6;">
                    ${data.story}
                </div>

                <div class="hack-warning">
                    <strong>⚠️ 風險警告：</strong> ${data.warning}
                </div>
            `;
        }

        // DOM 載入完成後初始化
        document.addEventListener('DOMContentLoaded', initKpiSystem);
    </script>
