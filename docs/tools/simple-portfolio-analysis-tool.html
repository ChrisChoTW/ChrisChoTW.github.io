<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>簡易投資健檢工具 - 一眼看懂投資狀況</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft JhengHei', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .summary-card {
            background: rgba(255,255,255,0.95);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
        }

        .summary-card h3 {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .summary-card .value {
            font-size: 2rem;
            font-weight: bold;
            color: #333;
        }

        .summary-card .profit {
            color: #27ae60;
        }

        .summary-card .loss {
            color: #e74c3c;
        }

        .summary-card .excellent {
            color: #27ae60;
        }

        .summary-card .warning {
            color: #f39c12;
        }

        .summary-card .danger {
            color: #e74c3c;
        }

        .add-section {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 40px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
        }

        .add-section h2 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }

        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .input-group input {
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .add-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: block;
            margin: 0 auto;
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }

        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
        }

        .investment-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            border-left: 6px solid #ddd;
        }

        .investment-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }

        .investment-card.good {
            border-left-color: #27ae60;
        }

        .investment-card.warning {
            border-left-color: #f39c12;
        }

        .investment-card.danger {
            border-left-color: #e74c3c;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: #333;
        }

        .delete-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .delete-btn:hover {
            background: #ff5252;
            transform: scale(1.1);
        }

        .card-stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat {
            text-align: center;
        }

        .stat-label {
            color: #666;
            font-size: 0.8rem;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .stat-value.excellent {
            color: #27ae60;
        }

        .stat-value.good {
            color: #2ecc71;
        }

        .stat-value.warning {
            color: #f39c12;
        }

        .stat-value.danger {
            color: #e74c3c;
        }

        .efficiency-score {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            margin-bottom: 15px;
        }

        .efficiency-label {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        .efficiency-value {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .action-suggestion {
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .action-continue {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .action-consider {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }

        .action-stop {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .explanation {
            font-size: 0.8rem;
            color: #666;
            margin-top: 8px;
            font-weight: normal;
        }

        .quick-add-section {
            margin-bottom: 20px;
            text-align: center;
        }

        .quick-add-btn {
            background: #17a2b8;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            margin: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .quick-add-btn:hover {
            background: #138496;
            transform: translateY(-1px);
        }

        .import-export-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            text-align: center;
        }

        .import-export-btn {
            background: #6c757d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            margin: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .import-export-btn:hover {
            background: #5a6268;
            transform: translateY(-1px);
        }

        .import-export-btn.export {
            background: #28a745;
        }

        .import-export-btn.export:hover {
            background: #218838;
        }

        .import-export-btn.import {
            background: #17a2b8;
        }

        .import-export-btn.import:hover {
            background: #138496;
        }

        #fileInput {
            display: none;
        }

        .charts-section {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 40px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 30px;
            margin-top: 20px;
        }

        .chart-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
            height: 350px;
        }

        .chart-title {
            text-align: center;
            color: #333;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .chart-canvas {
            position: relative;
            height: 280px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #333;
        }

        .empty-state p {
            font-size: 1.1rem;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }

            .input-grid {
                grid-template-columns: 1fr;
            }

            .portfolio-grid {
                grid-template-columns: 1fr;
            }

            .card-stats {
                grid-template-columns: 1fr 1fr;
            }

            .charts-grid {
                grid-template-columns: 1fr;
            }

            .chart-container {
                height: 300px;
            }

            .chart-canvas {
                height: 230px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💰 簡易投資健檢</h1>
            <p>一眼看懂你的投資狀況，簡單明瞭的建議</p>
        </div>

        <div class="summary-cards" id="summaryCards">
            <div class="summary-card">
                <h3>投資總額</h3>
                <div class="value" id="totalInvestment">$0</div>
            </div>
            <div class="summary-card">
                <h3>目前價值</h3>
                <div class="value" id="currentValue">$0</div>
            </div>
            <div class="summary-card">
                <h3>總損益</h3>
                <div class="value" id="totalPnL">$0</div>
            </div>
            <div class="summary-card">
                <h3>投資效率</h3>
                <div class="value" id="overallEfficiency">-%</div>
            </div>
        </div>

        <div class="add-section">
            <h2>➕ 新增投資項目</h2>

            <div class="quick-add-section">
                <p style="color: #666; margin-bottom: 15px;">快速範例：</p>
                <button class="quick-add-btn" onclick="addQuickExample('台積電', 3000, 72000, 85000, 24)">台積電範例</button>
                <button class="quick-add-btn" onclick="addQuickExample('0050', 5000, 120000, 125000, 24)">0050範例</button>
                <button class="quick-add-btn" onclick="addQuickExample('美股基金', 2000, 48000, 55000, 24)">基金範例</button>
            </div>

            <div class="input-grid">
                <div class="input-group">
                    <label>投資名稱</label>
                    <input type="text" id="investmentName" placeholder="例：台積電、0050、基金名稱">
                </div>
                <div class="input-group">
                    <label>每月投入金額</label>
                    <input type="number" id="monthlyAmount" placeholder="3000">
                </div>
                <div class="input-group">
                    <label>總投入成本</label>
                    <input type="number" id="totalCost" placeholder="72000">
                </div>
                <div class="input-group">
                    <label>目前市值</label>
                    <input type="number" id="currentMarketValue" placeholder="85000">
                </div>
                <div class="input-group">
                    <label>投資期間（月）</label>
                    <input type="number" id="investmentPeriod" placeholder="24" value="24">
                </div>
            </div>

            <button class="add-btn" onclick="addInvestment()">
                新增到我的投資組合
            </button>

            <div class="import-export-section">
                <p style="color: #666; margin-bottom: 15px;">💾 資料管理：</p>
                <button class="import-export-btn export" onclick="exportData()">📤 匯出資料</button>
                <button class="import-export-btn import" onclick="document.getElementById('fileInput').click()">📥 匯入資料</button>
                <button class="import-export-btn" onclick="clearAllData()">🗑️ 清空資料</button>
                <input type="file" id="fileInput" accept=".json" onchange="importData(event)">
            </div>
        </div>

        <div class="charts-section" id="chartsSection" style="display: none;">
            <h2 style="text-align: center; color: #333; margin-bottom: 20px;">📈 投資組合圖表分析</h2>
            <div class="charts-grid">
                <div class="chart-container">
                    <div class="chart-title">🍰 資產配置比例</div>
                    <div class="chart-canvas">
                        <canvas id="pieChart"></canvas>
                    </div>
                </div>
                <div class="chart-container">
                    <div class="chart-title">📈 投資表現排行</div>
                    <div class="chart-canvas">
                        <canvas id="barChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div id="portfolioContainer">
            <div class="empty-state">
                <h3>🎯 開始建立你的投資組合</h3>
                <p>使用上方的表單新增你的投資項目，立即獲得個人化建議</p>
            </div>
        </div>
    </div>

    <script>
        let portfolio = [];
        let pieChart = null;
        let barChart = null;


        // 快速範例
        function addQuickExample(name, monthly, cost, value, period) {
            document.getElementById('investmentName').value = name;
            document.getElementById('monthlyAmount').value = monthly;
            document.getElementById('totalCost').value = cost;
            document.getElementById('currentMarketValue').value = value;
            document.getElementById('investmentPeriod').value = period;
        }


        // 新增投資項目
        function addInvestment() {
            const name = document.getElementById('investmentName').value.trim();
            const monthly = parseFloat(document.getElementById('monthlyAmount').value);
            const cost = parseFloat(document.getElementById('totalCost').value);
            const value = parseFloat(document.getElementById('currentMarketValue').value);
            const period = parseInt(document.getElementById('investmentPeriod').value);

            if (!name || !monthly || !cost || !value || !period) {
                Swal.fire({
                    title: '⚠️ 欄位不完整',
                    text: '請填寫所有必要欄位',
                    icon: 'warning',
                    confirmButtonColor: '#667eea'
                });
                return;
            }

            const investment = {
                id: Date.now(),
                name,
                monthlyAmount: monthly,
                totalCost: cost,
                currentValue: value,
                investmentPeriod: period
            };

            portfolio.push(investment);
            clearForm();
            updateDisplay();
        }

        // 清空表單
        function clearForm() {
            document.getElementById('investmentName').value = '';
            document.getElementById('monthlyAmount').value = '';
            document.getElementById('totalCost').value = '';
            document.getElementById('currentMarketValue').value = '';
            document.getElementById('investmentPeriod').value = '24';
        }

        // 刪除投資項目
        function removeInvestment(id) {
            portfolio = portfolio.filter(item => item.id !== id);
            updateDisplay();
        }

        // 計算投資效率
        function calculateEfficiency(investment) {
            return (investment.monthlyAmount / investment.totalCost) * 100;
        }

        // 計算獲利率
        function calculateReturn(investment) {
            return ((investment.currentValue - investment.totalCost) / investment.totalCost) * 100;
        }

        // 取得數值顏色類別
        function getValueColorClass(value, type) {
            switch(type) {
                case 'efficiency':
                    if (value >= 4) return 'excellent';
                    if (value >= 2) return 'good';
                    if (value >= 1) return 'warning';
                    return 'danger';
                case 'return':
                    if (value >= 20) return 'excellent';
                    if (value >= 10) return 'good';
                    if (value >= 0) return 'warning';
                    return 'danger';
                case 'pnl':
                    if (value > 0) return 'excellent';
                    if (value === 0) return 'warning';
                    return 'danger';
                case 'overallEfficiency':
                    if (value >= 3) return 'excellent';
                    if (value >= 2) return 'good';
                    if (value >= 1) return 'warning';
                    return 'danger';
                default:
                    return '';
            }
        }

        // 取得建議動作
        function getAdvice(investment) {
            const efficiency = calculateEfficiency(investment);
            const returnRate = calculateReturn(investment);

            if (efficiency < 1 || returnRate > 50) {
                return {
                    action: 'stop',
                    class: 'danger',
                    actionClass: 'action-stop',
                    text: '建議停止定期定額',
                    explanation: efficiency < 1 ?
                        '每月投入金額對總成本影響太小' :
                        '獲利已達高點，考慮獲利了結'
                };
            } else if (efficiency < 2 || (returnRate > 30 && returnRate <= 50)) {
                return {
                    action: 'consider',
                    class: 'warning',
                    actionClass: 'action-consider',
                    text: '考慮調整投資策略',
                    explanation: efficiency < 2 ?
                        '投資效率偏低，可考慮減少投入或停扣' :
                        '獲利不錯，可考慮部分獲利了結'
                };
            } else {
                return {
                    action: 'continue',
                    class: 'good',
                    actionClass: 'action-continue',
                    text: '建議繼續定期定額',
                    explanation: '投資效率良好，繼續長期投資'
                };
            }
        }

        // 更新顯示
        function updateDisplay() {
            updateSummary();
            updatePortfolioDisplay();
            updateCharts();
        }

        // 更新總覽
        function updateSummary() {
            const totalInvestment = portfolio.reduce((sum, item) => sum + item.totalCost, 0);
            const totalValue = portfolio.reduce((sum, item) => sum + item.currentValue, 0);
            const totalPnL = totalValue - totalInvestment;

            let overallEfficiency = 0;
            if (portfolio.length > 0) {
                const totalMonthly = portfolio.reduce((sum, item) => sum + item.monthlyAmount, 0);
                overallEfficiency = (totalMonthly / totalInvestment) * 100;
            }

            document.getElementById('totalInvestment').textContent = `$${totalInvestment.toLocaleString()}`;
            document.getElementById('currentValue').textContent = `$${totalValue.toLocaleString()}`;

            const pnlElement = document.getElementById('totalPnL');
            pnlElement.textContent = `${totalPnL >= 0 ? '+' : ''}$${totalPnL.toLocaleString()}`;
            pnlElement.className = `value ${getValueColorClass(totalPnL, 'pnl')}`;

            const efficiencyElement = document.getElementById('overallEfficiency');
            efficiencyElement.textContent = `${overallEfficiency.toFixed(1)}%`;
            efficiencyElement.className = `value ${getValueColorClass(overallEfficiency, 'overallEfficiency')}`;
        }

        // 更新圖表
        function updateCharts() {
            if (portfolio.length === 0) {
                document.getElementById('chartsSection').style.display = 'none';
                return;
            }

            document.getElementById('chartsSection').style.display = 'block';

            // 销毁舊圖表
            if (pieChart) {
                pieChart.destroy();
            }
            if (barChart) {
                barChart.destroy();
            }

            // 創建圓餅圖數據
            const pieData = {
                labels: portfolio.map(item => item.name.length > 15 ? item.name.substring(0, 15) + '...' : item.name),
                datasets: [{
                    data: portfolio.map(item => item.currentValue),
                    backgroundColor: [
                        '#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF',
                        '#FF9F40', '#FF6384', '#C9CBCF', '#4BC0C0', '#FF6384',
                        '#36A2EB', '#FFCE56', '#9966FF'
                    ],
                    borderWidth: 2,
                    borderColor: '#fff'
                }]
            };

            // 創建長條圖數據
            const sortedPortfolio = [...portfolio].sort((a, b) => {
                const returnA = ((a.currentValue - a.totalCost) / a.totalCost) * 100;
                const returnB = ((b.currentValue - b.totalCost) / b.totalCost) * 100;
                return returnB - returnA;
            }).slice(0, 10); // 只顯示前10名

            const barData = {
                labels: sortedPortfolio.map(item => item.name.length > 12 ? item.name.substring(0, 12) + '...' : item.name),
                datasets: [{
                    label: '獲利率 %',
                    data: sortedPortfolio.map(item => ((item.currentValue - item.totalCost) / item.totalCost * 100).toFixed(1)),
                    backgroundColor: sortedPortfolio.map(item => {
                        const returnRate = ((item.currentValue - item.totalCost) / item.totalCost) * 100;
                        if (returnRate >= 20) return 'rgba(39, 174, 96, 0.8)';
                        if (returnRate >= 0) return 'rgba(52, 152, 219, 0.8)';
                        return 'rgba(231, 76, 60, 0.8)';
                    }),
                    borderColor: sortedPortfolio.map(item => {
                        const returnRate = ((item.currentValue - item.totalCost) / item.totalCost) * 100;
                        if (returnRate >= 20) return 'rgba(39, 174, 96, 1)';
                        if (returnRate >= 0) return 'rgba(52, 152, 219, 1)';
                        return 'rgba(231, 76, 60, 1)';
                    }),
                    borderWidth: 2
                }]
            };

            // 創建圓餅圖
            const pieCtx = document.getElementById('pieChart').getContext('2d');
            pieChart = new Chart(pieCtx, {
                type: 'pie',
                data: pieData,
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                boxWidth: 12,
                                fontSize: 10,
                                generateLabels: function(chart) {
                                    const data = chart.data;
                                    const total = data.datasets[0].data.reduce((sum, val) => sum + val, 0);
                                    return data.labels.map((label, i) => {
                                        const value = data.datasets[0].data[i];
                                        const percentage = ((value / total) * 100).toFixed(1);
                                        return {
                                            text: `${label}: ${percentage}%`,
                                            fillStyle: data.datasets[0].backgroundColor[i],
                                            hidden: false,
                                            index: i
                                        };
                                    });
                                }
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const value = context.raw;
                                    const total = context.dataset.data.reduce((sum, val) => sum + val, 0);
                                    const percentage = ((value / total) * 100).toFixed(1);
                                    return `$${value.toLocaleString()} (${percentage}%)`;
                                }
                            }
                        }
                    }
                }
            });

            // 創建長條圖
            const barCtx = document.getElementById('barChart').getContext('2d');
            barChart = new Chart(barCtx, {
                type: 'bar',
                data: barData,
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: function(value) {
                                    return value + '%';
                                }
                            }
                        },
                        x: {
                            ticks: {
                                maxRotation: 45,
                                minRotation: 45
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return `獲利率: ${context.raw}%`;
                                }
                            }
                        }
                    }
                }
            });
        }

        // 更新投資組合顯示
        function updatePortfolioDisplay() {
            const container = document.getElementById('portfolioContainer');

            if (portfolio.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>🎯 開始建立你的投資組合</h3>
                        <p>使用上方的表單新增你的投資項目，立即獲得個人化建議</p>
                    </div>
                `;
                return;
            }

            const portfolioHTML = portfolio.map(investment => {
                const efficiency = calculateEfficiency(investment);
                const returnRate = calculateReturn(investment);
                const advice = getAdvice(investment);
                const pnl = investment.currentValue - investment.totalCost;

                return `
                    <div class="investment-card ${advice.class}">
                        <div class="card-header">
                            <div class="card-title">${investment.name}</div>
                            <button class="delete-btn" onclick="removeInvestment(${investment.id})">×</button>
                        </div>

                        <div class="card-stats">
                            <div class="stat">
                                <div class="stat-label">每月投入</div>
                                <div class="stat-value">$${investment.monthlyAmount.toLocaleString()}</div>
                            </div>
                            <div class="stat">
                                <div class="stat-label">總成本</div>
                                <div class="stat-value">$${investment.totalCost.toLocaleString()}</div>
                            </div>
                            <div class="stat">
                                <div class="stat-label">目前市值</div>
                                <div class="stat-value">$${investment.currentValue.toLocaleString()}</div>
                            </div>
                            <div class="stat">
                                <div class="stat-label">總損益</div>
                                <div class="stat-value ${getValueColorClass(pnl, 'pnl')}">
                                    ${pnl >= 0 ? '+' : ''}$${pnl.toLocaleString()}
                                </div>
                            </div>
                            <div class="stat">
                                <div class="stat-label">投資效率</div>
                                <div class="stat-value ${getValueColorClass(efficiency, 'efficiency')}">${efficiency.toFixed(1)}%</div>
                            </div>
                            <div class="stat">
                                <div class="stat-label">獲利率</div>
                                <div class="stat-value ${getValueColorClass(returnRate, 'return')}">
                                    ${returnRate >= 0 ? '+' : ''}${returnRate.toFixed(1)}%
                                </div>
                            </div>
                        </div>

                        <div class="action-suggestion ${advice.actionClass}">
                            ${advice.text}
                            <div class="explanation">${advice.explanation}</div>
                        </div>
                    </div>
                `;
            }).join('');

            container.innerHTML = `<div class="portfolio-grid">${portfolioHTML}</div>`;
        }

        // 匯出資料
        async function exportData() {
            if (portfolio.length === 0) {
                Swal.fire({
                    title: '📤 無資料可匯出',
                    text: '請先新增投資項目再進行匯出',
                    icon: 'info',
                    confirmButtonColor: '#667eea'
                });
                return;
            }

            const dataToExport = {
                portfolio: portfolio,
                exportDate: new Date().toISOString(),
                version: '1.0'
            };

            const blob = new Blob([JSON.stringify(dataToExport, null, 2)], {
                type: 'application/json'
            });

            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `投資組合_${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            Swal.fire({
                title: '✅ 匯出成功！',
                text: '投資組合資料已成功下載',
                icon: 'success',
                confirmButtonColor: '#667eea'
            });
        }

        // 匯入資料
        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);

                    if (data.portfolio && Array.isArray(data.portfolio)) {
                        // 驗證資料格式
                        const isValidData = data.portfolio.every(item =>
                            item.name &&
                            typeof item.monthlyAmount === 'number' &&
                            typeof item.totalCost === 'number' &&
                            typeof item.currentValue === 'number' &&
                            typeof item.investmentPeriod === 'number'
                        );

                        if (isValidData) {
                            portfolio = data.portfolio.map(item => ({
                                ...item,
                                id: Date.now() + Math.random() // 重新生成ID避免衝突
                            }));
                            updateDisplay();
                            Swal.fire({
                                title: '✅ 匯入成功！',
                                text: `成功匯入 ${portfolio.length} 筆投資資料`,
                                icon: 'success',
                                confirmButtonColor: '#667eea'
                            });
                        } else {
                            Swal.fire({
                                title: '❌ 格式錯誤',
                                text: '檔案格式不正確，請檢查資料內容',
                                icon: 'error',
                                confirmButtonColor: '#667eea'
                            });
                        }
                    } else {
                        Swal.fire({
                            title: '❌ 匯入失敗',
                            text: '檔案格式不正確，無法匯入',
                            icon: 'error',
                            confirmButtonColor: '#667eea'
                        });
                    }
                } catch (error) {
                    Swal.fire({
                        title: '❌ 讀取失敗',
                        text: '檔案讀取失敗，請確認是否為有效的 JSON 檔案',
                        icon: 'error',
                        confirmButtonColor: '#667eea'
                    });
                }
            };
            reader.readAsText(file);

            // 清空輸入框，允許重複匯入同一檔案
            event.target.value = '';
        }

        // 清空所有資料
        async function clearAllData() {
            if (portfolio.length === 0) {
                Swal.fire({
                    title: '🗑️ 無資料可清空',
                    text: '目前沒有投資資料需要清空',
                    icon: 'info',
                    confirmButtonColor: '#667eea'
                });
                return;
            }

            const result = await Swal.fire({
                title: '⚠️ 確認清空？',
                text: '確定要清空所有投資資料嗎？此操作無法復原。',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#e74c3c',
                cancelButtonColor: '#6c757d',
                confirmButtonText: '是的，清空！',
                cancelButtonText: '取消'
            });

            if (result.isConfirmed) {
                portfolio = [];
                updateDisplay();
                Swal.fire({
                    title: '✅ 清空完成',
                    text: '所有投資資料已清空',
                    icon: 'success',
                    confirmButtonColor: '#667eea'
                });
            }
        }

        // 初始化
        updateDisplay();

        // 處理窗口大小變化
        window.addEventListener('resize', function() {
            if (pieChart) pieChart.resize();
            if (barChart) barChart.resize();
        });
    </script>
</body>
</html>
